/* quiz */
let Q=null;
function blankOut(k){const stem=k.replace(/[ey]$/,'');const re=new RegExp('\\b'+stem+'\\w*','i');const s=D[k][5];return re.test(s)?s.replace(re,'＿＿＿＿'):null}
function makeItems(keys){
  return shuffle(keys.slice()).map((k,i)=>{
    let type=i%2?'cloze':'mean',blank=null;
    if(type==='cloze'){blank=blankOut(k);if(!blank)type='mean'}
    const pool=shuffle(KEYS.filter(x=>x!==k));let opts;
    if(type==='mean'){const used=new Set([D[k][2]]);opts=[{v:k,l:D[k][2]}];for(const x of pool){if(opts.length>=4)break;if(used.has(D[x][2]))continue;used.add(D[x][2]);opts.push({v:x,l:D[x][2]})}}
    else opts=[k,...pool.slice(0,3)].map(x=>({v:x,l:x}));
    return{k,type,blank,opts:shuffle(opts),picked:null};
  });
}
function startQuiz(keys,from,title){Q={keys:keys.slice(),items:makeItems(keys),i:0,score:0,wrong:[],from,title};go('quiz')}
function vQuiz(){
  if(!Q){
    const sv=Object.keys(S.saved),sn=Object.keys(S.seen);
    if(!sn.length&&!sv.length)return `<h1 style="font-size:28px">隨堂測驗</h1><p class="empty">先去讀一章故事。學過的單字會出現在這裡讓你測驗。</p><a class="btn primary" href="#plan">去讀故事</a>`;
    return `<h1 style="font-size:28px">隨堂測驗</h1><p class="muted" style="margin-top:6px">每次最多 12 題，看英文選中文，或替例句填空。</p>
    <div class="stack section">${sv.length?`<button class="btn primary wide" data-act="qsaved">測驗收藏的單字（${sv.length} 個）</button>`:''}${sn.length?`<button class="btn ghost wide" data-act="qseen">測驗學過的單字（${sn.length} 個）</button>`:''}</div>`;
  }
  const N=Q.items.length;
  if(Q.i>=N){
    const r=Q.score/N;
    const v=r>=.9?'不錯。今天准妳準時下班。':r>=.6?'還可以，但我要的是滿分。':'重來。我陪妳。';
    return `<p class="muted">${Q.title}</p><p class="score">${Q.score}<small>/${N}</small></p><p class="verdict">${v}</p><p class="muted" style="margin-top:4px;text-align:right;font-family:var(--serif)">陸景川</p>
    ${Q.wrong.length?`<section class="section"><h2>答錯的字</h2><div class="chips" style="margin-top:12px">${Q.wrong.map(k=>`<button class="chip" data-w="${k}">${k}</button>`).join('')}</div></section>`:''}
    <div class="stack section"><button class="btn primary wide" data-act="retry">再測一次</button>${Q.wrong.length?`<button class="btn ghost wide" data-act="savewrong">把答錯的字加入生字本</button>`:''}<a class="btn ghost wide" href="${Q.from?'#ch'+Q.from:'#words'}">${Q.from?'回到本章':'回生字本'}</a></div>`;
  }
  const it=Q.items[Q.i],w=D[it.k],done=it.picked!==null;
  const prompt=it.type==='mean'
    ?`<p class="qask">這個字是什麼意思？</p><div class="row" style="margin-top:14px;align-items:center"><p class="qword" style="margin:0">${it.k}</p><button class="iconbtn" data-act="say" data-t="${it.k}" aria-label="播放 ${it.k} 發音">${I.speak}</button></div><p class="ipa">/${w[0]}/</p>`
    :`<p class="qask">選出最適合填入空格的單字</p><p class="qsent">${it.blank}</p><p class="muted" style="margin-top:6px">${w[6]}</p>`;
  const opts=it.opts.map(o=>{let cls='opt'+(it.type==='cloze'?' en':'');if(done){if(o.v===it.k)cls+=' right';else if(o.v===it.picked)cls+=' wrong'}return `<button class="${cls}" data-act="pick" data-v="${o.v}"${done?' disabled':''}>${o.l}</button>`}).join('');
  const fb=done?`<div class="fb">${it.picked===it.k?'答對了。':'答案是 '}<b>${it.k}</b> ${w[2]}<br><span class="muted">${w[5]}</span></div><div class="section" style="margin-top:18px"><button class="btn primary wide" data-act="next" id="nextq">${Q.i+1<N?'下一題':'看結果'}</button></div>`:'';
  return `<div class="qhead"><span>${Q.title}</span><span>第 ${Q.i+1} 題，共 ${N} 題</span></div><div class="meter"><i style="width:${Q.i/N*100}%"></i></div>${prompt}<div class="opts">${opts}</div>${fb}`;
}

/* word list */
const W={tab:'saved',ex:'all',q:''};
function wordKeys(){
  let ks=W.tab==='saved'?Object.keys(S.saved).sort((a,b)=>S.saved[b]-S.saved[a]):KEYS.slice();
  if(W.ex==='I')ks=ks.filter(isI);else if(W.ex==='T')ks=ks.filter(isT);
  const q=W.q.trim().toLowerCase();if(q)ks=ks.filter(k=>k.includes(q)||D[k][2].includes(q));
  return ks;
}
function wordRows(){
  const ks=wordKeys();
  if(!ks.length){if(W.tab==='saved'&&!Object.keys(S.saved).length)return '<p class="empty">還沒有收藏的單字。讀故事時點一下英文字，再按「加入生字本」。</p>';return '<p class="empty">沒有符合的單字。換個關鍵字或篩選試試。</p>'}
  return `<ul class="wl">${ks.map(k=>`<li class="wr"><button class="wbtn" data-w="${k}"><span class="wk">${k}</span><span class="wi">/${D[k][0]}/</span><span class="wz">${D[k][1]} ${D[k][2]}${S.known[k]?'<span class="ok">已熟記</span>':''}</span></button><button class="iconbtn" data-act="star" data-k="${k}" aria-pressed="${!!S.saved[k]}" aria-label="${S.saved[k]?'移出生字本':'加入生字本'}：${k}">${S.saved[k]?I.starOn:I.star}</button></li>`).join('')}</ul>`;
}
function vWords(){
  const sv=Object.keys(S.saved).length;
  return `<h1 style="font-size:30px;font-weight:900">生字本</h1>
  <div class="row" style="margin-top:16px;justify-content:space-between">
    <div class="seg" role="group" aria-label="單字範圍"><button data-act="wtab" data-v="saved" aria-pressed="${W.tab==='saved'}">收藏 ${sv}</button><button data-act="wtab" data-v="all" aria-pressed="${W.tab==='all'}">全部 ${KEYS.length}</button></div>
    <div class="seg" role="group" aria-label="考試類別"><button data-act="wex" data-v="all" aria-pressed="${W.ex==='all'}">全部</button><button data-act="wex" data-v="I" aria-pressed="${W.ex==='I'}">雅思</button><button data-act="wex" data-v="T" aria-pressed="${W.ex==='T'}">多益</button></div>
  </div>
  <label class="sr" for="wq">搜尋單字</label><input id="wq" class="search" type="search" placeholder="搜尋英文或中文" value="${W.q.replace(/"/g,'&quot;')}" style="margin-top:14px" autocomplete="off">
  <div class="row" style="margin-top:14px"><a class="btn primary" href="#cards">翻卡複習</a><button class="btn ghost" data-act="qlist">測驗這些單字</button></div>
  <div id="wl" style="margin-top:8px">${wordRows()}</div>`;
}

/* cards */
let C=null;
function buildCards(){let l=Object.keys(S.saved).filter(k=>!S.known[k]);if(!l.length)l=Object.keys(S.saved);if(!l.length)l=Object.keys(S.seen).filter(k=>!S.known[k]);if(!l.length)l=Object.keys(S.seen);return shuffle(l)}
function vCards(){
  if(!C)C={list:buildCards(),i:0,flip:false,got:0};
  const back=`<a class="back" href="#words">${I.back}生字本</a>`;
  if(!C.list.length)return back+`<h1 style="font-size:28px;margin-top:6px">翻卡複習</h1><p class="empty">還沒有可以複習的單字。先讀一章故事，或在生字本收藏幾個字。</p><a class="btn primary" href="#plan">去讀故事</a>`;
  if(C.i>=C.list.length)return back+`<h1 style="font-size:28px;margin-top:6px">這一輪複習完了</h1><p class="lead section" style="margin-top:14px">翻了 <b>${C.list.length}</b> 張卡，記住 <b>${C.got}</b> 個。</p><div class="stack section"><button class="btn primary wide" data-act="cagain">再來一輪</button><a class="btn ghost wide" href="#home">回首頁</a></div>`;
  const k=C.list[C.i],w=D[k];
  const face=C.flip
    ?`<p class="hw" style="font-size:34px">${k}</p><p class="mean"><span class="pos">${w[1]}</span>${w[2]}</p><p class="en">${w[5]}</p><p class="zh">${w[6]}</p>`
    :`<p class="hw">${k}</p><p class="ipa" style="margin-top:6px">/${w[0]}/</p><p style="margin-top:10px">${tags(k)}</p><p class="hint">點卡片翻面</p>`;
  return back+`<div class="qhead" style="margin-top:6px"><span>翻卡複習</span><span>${C.i+1} / ${C.list.length}</span></div><div class="meter"><i style="width:${C.i/C.list.length*100}%"></i></div>
  <button class="card" data-act="flip" aria-label="${C.flip?'翻回正面':'翻面看意思'}">${face}</button>
  <div class="row" style="margin-top:16px"><button class="iconbtn" data-act="say" data-t="${k}" aria-label="播放發音">${I.speak}</button><button class="btn ghost" style="flex:1" data-act="cnext">還不熟</button><button class="btn primary" style="flex:1" data-act="cknow">記住了</button></div>`;
}

/* stats */
function vStats(){
  const seen=Object.keys(S.seen),known=Object.keys(S.known),saved=Object.keys(S.saved);
  const iAll=KEYS.filter(isI),tAll=KEYS.filter(isT),iSeen=iAll.filter(k=>S.seen[k]).length,tSeen=tAll.filter(k=>S.seen[k]).length;
  const done=CH.filter(c=>S.ch[c.n]&&S.ch[c.n].score!=null);
  const days=[];const d=new Date();d.setDate(d.getDate()-6);for(let i=0;i<7;i++){days.push({l:i===6?'今天':`${d.getMonth()+1}/${d.getDate()}`,v:(S.days[fmt(d)]||[]).length});d.setDate(d.getDate()+1)}
  const max=Math.max(S.goal,...days.map(x=>x.v));const gy=100-S.goal/max*82;
  const bars=days.map((x,i)=>{const h=x.v/max*82,X=12+i*40;return `<rect x="${X}" y="${100-h}" width="24" height="${Math.max(h,1.5)}" rx="4" fill="${x.v>=S.goal?'var(--gold-2)':'var(--line)'}"/><text x="${X+12}" y="116" text-anchor="middle">${x.l}</text>${x.v?`<text x="${X+12}" y="${96-h}" text-anchor="middle" style="fill:var(--ink)">${x.v}</text>`:''}`}).join('');
  const rates=[[0.8,'慢'],[1,'正常'],[1.15,'快']];
  const vopts=(want,cur)=>{const l=voiceList(want);if(!l.length)return '';const sel=pickVoice(want);return `<select class="vsel" id="v${want}" aria-label="${want==='en'?'英文語音':'中文語音'}">${l.map((v,i)=>`<option value="${v.voiceURI.replace(/"/g,'&quot;')}"${sel&&sel.voiceURI===v.voiceURI?' selected':''}>${v.name}${i===0?'（推薦）':''}</option>`).join('')}</select>`};
  const ven=vopts('en'),vzh=vopts('zh');
  return `<h1 style="font-size:30px;font-weight:900">進度</h1>
  <p class="lead" style="margin-top:14px">你已經學過 <b>${seen.length}</b> 個單字，熟記 <b>${known.length}</b> 個，連續學習 <b>${streak()}</b> 天。</p>
  <section class="section"><h2>考試範圍</h2>
    <div class="exam"><span>雅思</span><span class="bar"><i style="width:${iSeen/iAll.length*100}%;background:var(--green)"></i></span><span>${iSeen} / ${iAll.length}</span></div>
    <div class="exam"><span>多益</span><span class="bar"><i style="width:${tSeen/tAll.length*100}%;background:var(--gold-2)"></i></span><span>${tSeen} / ${tAll.length}</span></div>
    <p class="muted" style="font-size:13px;margin-top:8px">有些單字兩種考試都常出現，會同時算進兩邊。</p>
  </section>
  <section class="section"><h2>最近七天</h2>
    <div style="overflow-x:auto"><svg class="chart" viewBox="0 0 292 122" style="width:100%;min-width:280px;margin-top:10px" role="img" aria-label="最近七天每日學習單字數"><line x1="4" x2="288" y1="${gy}" y2="${gy}" stroke="var(--gold-2)" stroke-dasharray="3 4" stroke-width="1"/><text x="288" y="${gy-4}" text-anchor="end">目標 ${S.goal}</text>${bars}</svg></div>
  </section>
  <section class="section"><h2>測驗成績</h2>${done.length?`<ul class="scorelist" style="margin-top:6px">${done.map(c=>`<li><span>第 ${c.n} 天　${c.t}</span><span>${S.ch[c.n].best} / ${c.words.length}</span></li>`).join('')}</ul>`:'<p class="empty" style="padding:8px 0">讀完一章並完成測驗後，成績會記在這裡。</p>'}
    <p class="muted" style="margin-top:10px;font-size:14px">已完成 ${done.length} / ${CH.length} 章，收藏 ${saved.length} 個單字。</p></section>
  <section class="section"><h2>設定</h2>
    <div class="setrow"><span>每日目標</span><div class="seg" role="group" aria-label="每日目標">${[8,12,20,30].map(g=>`<button data-act="goal" data-v="${g}" aria-pressed="${S.goal===g}">${g} 個</button>`).join('')}</div></div>
    <div class="setrow"><span>朗讀方式</span><div class="seg" role="group" aria-label="朗讀方式"><button data-act="mode" data-v="smooth" aria-pressed="${S.mode==='smooth'}">流暢整句</button><button data-act="mode" data-v="switch" aria-pressed="${S.mode==='switch'}">中英切換</button></div></div>
    <p class="muted" style="font-size:13px;padding-top:8px">流暢整句用中文語音一口氣唸完，比較自然；中英切換會讓英文字改用英文語音，發音較標準，但句子之間會有停頓。</p>
    <div class="setrow"><span>英文語音</span>${ven||'<span class="muted" style="font-size:14px">這個瀏覽器沒有提供英文語音</span>'}</div>
    <div class="setrow"><span>中文語音</span>${vzh||'<span class="muted" style="font-size:14px">這個瀏覽器沒有提供中文語音</span>'}</div>
    <div class="setrow"><span>朗讀速度</span><div class="seg" role="group" aria-label="朗讀速度">${rates.map(([v,l])=>`<button data-act="rate" data-v="${v}" aria-pressed="${S.rate===v}">${l}</button>`).join('')}</div></div>
    <p class="muted" style="font-size:13px;padding-top:10px">聲音聽起來生硬，通常是因為裝置只有基本語音。名稱有 Natural、Online、Google 或「加強版」的語音最自然；iPhone 可以到「設定 &gt; 輔助使用 &gt; 朗讀內容 &gt; 聲音」下載加強版語音，Windows 用 Edge 瀏覽器會有自然語音可選。</p>
  </section>
  <section class="section"><h2>備份與換裝置</h2>
    <p class="muted" style="font-size:14px;margin-top:4px">學習紀錄只存在這台裝置的瀏覽器裡，每個人、每台裝置的進度都是分開的。換手機或電腦時，先在舊裝置產生備份碼，再貼到新裝置還原。</p>
    <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="export">產生備份碼</button><button class="btn ghost" data-act="showimport">貼上備份碼還原</button></div>
    <div id="bkarea"></div>
    <div class="setrow" style="border:0;margin-top:8px"><span>清除這台裝置上的紀錄</span><button class="btn danger" data-act="reset" id="resetbtn">清除所有紀錄</button></div>
  </section>`;
}

/* ---------- word sheet ---------- */
const sheet=$('#sheet'),scrim=$('#scrim');let sheetK=null,lastFocus=null;
function sheetHTML(k){const w=D[k],ch=chapterOf(k);
  return `<div class="sh-top"><div style="min-width:0"><p class="hw" id="sh-word">${k}</p><div class="row" style="margin-top:6px;gap:12px"><span class="ipa">/${w[0]}/</span><button class="iconbtn" data-act="say" data-t="${k}" aria-label="播放 ${k} 發音">${I.speak}</button><button class="btn ghost" style="min-height:40px;padding:0 14px" data-act="say" data-t="${k}" data-slow="1">慢速</button></div></div><button class="iconbtn" data-act="shclose" aria-label="關閉">${I.close}</button></div>
  <p class="mean"><span class="pos">${w[1]}</span>${w[2]}</p><p style="margin-top:8px">${tags(k)}${ch?`<span class="muted" style="font-size:13px">出自第 ${ch.n} 天〈${ch.t}〉</span>`:''}</p>
  <div class="ex"><div style="flex:1"><p class="en">${w[5]}</p><p class="zh">${w[6]}</p></div><button class="iconbtn" data-act="say" data-t="${w[5].replace(/"/g,'&quot;')}" aria-label="播放例句">${I.speak}</button></div>
  <dl class="rel">${w[3].length?`<dt>同義</dt><dd>${w[3].join(', ')}</dd>`:''}${w[4].length?`<dt>反義</dt><dd>${w[4].join(', ')}</dd>`:''}</dl>
  <div class="sh-act"><button class="btn ghost${S.saved[k]?' on':''}" data-act="shsave">${S.saved[k]?I.starOn+'已在生字本':I.star+'加入生字本'}</button><button class="btn ghost${S.known[k]?' okd':''}" data-act="shknow">${I.check}${S.known[k]?'已熟記':'標記熟記'}</button></div>`}
function openWord(k){if(!D[k])return;touch(k);sheetK=k;lastFocus=document.activeElement;sheet.innerHTML=sheetHTML(k);sheet.classList.add('open');scrim.classList.add('open');setTimeout(()=>sheet.focus(),30);refreshMarks(k)}
function closeSheet(){if(!sheetK)return;sheet.classList.remove('open');scrim.classList.remove('open');sheetK=null;const h=curView();if(h==='home'||h==='stats'||h==='words')render(true);if(lastFocus&&document.contains(lastFocus))lastFocus.focus()}
function refreshMarks(k){document.querySelectorAll(`[data-w="${k}"]`).forEach(el=>{if(el.classList.contains('w')){el.classList.add('seen');el.classList.toggle('saved',!!S.saved[k])}if(el.classList.contains('chip')){el.classList.toggle('known',!!S.known[k]);el.classList.toggle('seen',!S.known[k])}})}
scrim.addEventListener('click',closeSheet);
sheet.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const k=sheetK;
  if(a.dataset.act==='shclose')closeSheet();
  else if(a.dataset.act==='say')speak(a.dataset.t,'en',a.dataset.slow?0.65:1);
  else if(a.dataset.act==='shsave'){if(S.saved[k])delete S.saved[k];else S.saved[k]=Date.now();save();sheet.innerHTML=sheetHTML(k);refreshMarks(k);toast(S.saved[k]?'已加入生字本':'已移出生字本')}
  else if(a.dataset.act==='shknow'){if(S.known[k])delete S.known[k];else S.known[k]=Date.now();save();sheet.innerHTML=sheetHTML(k);refreshMarks(k)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetK)closeSheet();if(e.key==='Tab'&&sheetK){const f=[...sheet.querySelectorAll('button')];if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===sheet)){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});

/* ---------- actions ---------- */
let resetArm=false;
app.addEventListener('click',e=>{
  const w=e.target.closest('[data-w]');if(w){openWord(w.dataset.w);return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,v=a.dataset.v;
  switch(act){
    case'gloss':S.gloss=!S.gloss;save();a.setAttribute('aria-checked',S.gloss);document.querySelector('.story').classList.toggle('nogloss',!S.gloss);break;
    case'read':readChapter(CH[S.last-1]);break;
    case'finish':{const n=+a.dataset.n;S.ch[n]=Object.assign(S.ch[n]||{},{read:true});save();startQuiz(CH[n-1].words,n,`第 ${n} 天測驗`);break}
    case'say':speak(a.dataset.t);break;
    case'pick':{const it=Q.items[Q.i];if(it.picked!==null)return;it.picked=v;if(v===it.k){Q.score++;touch(it.k)}else Q.wrong.push(it.k);render(true);const nb=$('#nextq');if(nb)nb.focus();break}
    case'next':Q.i++;if(Q.i>=Q.items.length&&Q.from){const r=S.ch[Q.from]||{};S.ch[Q.from]=Object.assign(r,{read:true,score:Q.score,best:Math.max(r.best||0,Q.score)});save()}render();break;
    case'retry':startQuiz(Q.keys,Q.from,Q.title);break;
    case'savewrong':Q.wrong.forEach(k=>{if(!S.saved[k])S.saved[k]=Date.now()});save();toast(`已把 ${Q.wrong.length} 個字加入生字本`);break;
    case'qsaved':startQuiz(shuffle(Object.keys(S.saved)).slice(0,12),0,'收藏單字測驗');break;
    case'qseen':startQuiz(shuffle(Object.keys(S.seen)).slice(0,12),0,'學過的單字測驗');break;
    case'qlist':{const ks=wordKeys();if(!ks.length){toast('清單裡沒有單字可以測驗');return}startQuiz(shuffle(ks.slice()).slice(0,12),0,W.tab==='saved'?'收藏單字測驗':'單字測驗');break}
    case'star':{const k=a.dataset.k;if(S.saved[k])delete S.saved[k];else S.saved[k]=Date.now();save();render(true);break}
    case'wtab':W.tab=v;render(true);break;
    case'wex':W.ex=v;render(true);break;
    case'flip':C.flip=!C.flip;render(true);$('.card')&&$('.card').focus();break;
    case'cnext':C.i++;C.flip=false;render(true);break;
    case'cknow':S.known[C.list[C.i]]=Date.now();touch(C.list[C.i]);save();C.got++;C.i++;C.flip=false;render(true);break;
    case'cagain':C=null;render();break;
    case'goal':S.goal=+v;save();render(true);break;
    case'rate':S.rate=+v;save();render(true);speak('Good. Now say it again.');break;
    case'mode':S.mode=v;save();render(true);break;
    case'export':{let code='';try{code=btoa(unescape(encodeURIComponent(JSON.stringify(S))))}catch(e){}$('#bkarea').innerHTML=`<label class="sr" for="bkcode">備份碼</label><textarea id="bkcode" class="search" readonly style="margin-top:12px;min-height:110px;padding:10px;font-size:13px;font-family:ui-monospace,monospace">${code}</textarea><div class="row" style="margin-top:8px"><button class="btn primary" data-act="copybk">複製備份碼</button></div>`;break}
    case'copybk':{const t=$('#bkcode');t.select();t.setSelectionRange(0,t.value.length);const ok=()=>toast('已複製備份碼');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(ok,()=>{try{document.execCommand('copy');ok()}catch(e){toast('請長按文字框手動複製')}})}else{try{document.execCommand('copy');ok()}catch(e){toast('請長按文字框手動複製')}}break}
    case'showimport':$('#bkarea').innerHTML=`<label class="sr" for="rscode">貼上備份碼</label><textarea id="rscode" class="search" placeholder="把備份碼貼在這裡" style="margin-top:12px;min-height:110px;padding:10px;font-size:13px"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" data-act="doimport">還原進度</button></div>`;$('#rscode').focus();break;
    case'doimport':{const raw=($('#rscode').value||'').trim();try{const o=JSON.parse(decodeURIComponent(escape(atob(raw))));if(!o||typeof o!=='object'||!o.seen)throw 0;S=Object.assign(fresh(),o);if(![0.8,1,1.15].includes(S.rate))S.rate=1;save();C=null;Q=null;render(true);toast('進度已還原')}catch(e){toast('備份碼無法辨識，請確認有完整複製')}break}
    case'reset':if(!resetArm){resetArm=true;a.textContent='再按一次確認清除';setTimeout(()=>{resetArm=false;const b=$('#resetbtn');if(b)b.textContent='清除所有紀錄'},4000)}else{resetArm=false;S=fresh();save();C=null;Q=null;render(true);toast('紀錄已清除')}break;
  }
});
app.addEventListener('change',e=>{if(e.target.id==='ven'){S.voiceEn=e.target.value;save();speak('Negotiate. We need to negotiate better terms.','en')}else if(e.target.id==='vzh'){S.voiceZh=e.target.value;save();speak('女人，今天的單字背完了嗎？','zh')}});
app.addEventListener('input',e=>{if(e.target.id==='wq'){W.q=e.target.value;$('#wl').innerHTML=wordRows()}});

/* ---------- router ---------- */
function curView(){return location.hash.slice(1)||'home'}
function go(h){if(curView()===h)render();else location.hash=h}
function render(keepScroll){
  const h=curView();let html,tab;
  const m=/^ch(\d+)$/.exec(h);
  if(m&&CH[+m[1]-1]){html=vChapter(+m[1]);tab='plan'}
  else if(h==='plan'){html=vPlan();tab='plan'}
  else if(h==='words'){html=vWords();tab='words'}
  else if(h==='cards'){html=vCards();tab='words'}
  else if(h==='quiz'){html=vQuiz();tab=Q&&Q.from?'plan':'words'}
  else if(h==='stats'){html=vStats();tab='stats'}
  else{html=vHome();tab='home'}
  const y=window.scrollY;app.innerHTML=html;
  document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.tab===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(keepScroll)window.scrollTo(0,y);
}
let lastView=null;
function route(){
  const h=curView();
  if(R.on)stopRead();
  if(sheetK){sheet.classList.remove('open');scrim.classList.remove('open');sheetK=null}
  if(h==='cards'&&lastView!=='cards')C=null;
  render();window.scrollTo(0,0);
  if(lastView!==null)app.focus({preventScroll:true});
  lastView=h;
}
window.addEventListener('hashchange',route);
route();
</script>
</body>
</html>
