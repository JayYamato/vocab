<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>總裁的單字課</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EBEF;--surface:#F8F8F6;--sunk:#DEE1E7;--ink:#1A2233;--muted:#586174;--line:#C9CDD6;
  --gold:#8C6A33;--gold-2:#B8925A;--gold-soft:#EFE5D1;
  --green:#24584B;--green-soft:#DCEAE5;--rose:#9E3446;--rose-soft:#F3DDE1;
  --scrim:rgba(14,18,28,.45);
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --en:"EB Garamond",Garamond,Georgia,"Times New Roman",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10141C;--surface:#181E29;--sunk:#232B39;--ink:#ECE8DF;--muted:#9AA2B1;--line:#2F3848;
    --gold:#D2B07A;--gold-2:#C29E64;--gold-soft:#332C20;
    --green:#7DBBA8;--green-soft:#1C332D;--rose:#E58C9B;--rose-soft:#3A2129;
    --scrim:rgba(0,0,0,.6);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10141C;--surface:#181E29;--sunk:#232B39;--ink:#ECE8DF;--muted:#9AA2B1;--line:#2F3848;
  --gold:#D2B07A;--gold-2:#C29E64;--gold-soft:#332C20;
  --green:#7DBBA8;--green-soft:#1C332D;--rose:#E58C9B;--rose-soft:#3A2129;
  --scrim:rgba(0,0,0,.6);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
main:focus{outline:none}
:focus-visible{outline:2px solid var(--gold-2);outline-offset:3px;border-radius:6px}
img,svg{max-width:100%}
main{max-width:640px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-right,0px)) 120px max(18px,env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700}
h2{font-size:21px;line-height:1.35}
p{margin:0}
.muted{color:var(--muted)}
.stack>*+*{margin-top:14px}
.section{margin-top:34px}
.section>h2{margin-bottom:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:500;font-size:15px;text-decoration:none;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);color:var(--surface)}
.btn.ghost{box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.wide{width:100%}
.btn.danger{color:var(--rose);box-shadow:inset 0 0 0 1.5px var(--rose)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.iconbtn{width:42px;height:42px;flex:none;border-radius:50%;display:inline-grid;place-items:center;box-shadow:inset 0 0 0 1.5px var(--line)}
.iconbtn svg{width:19px;height:19px}
.iconbtn[aria-pressed="true"]{color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold-2);background:var(--gold-soft)}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:6px 14px;border-radius:999px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* the order slip (home hero) */
.order{background:var(--surface);border-left:4px solid var(--gold-2);border-radius:3px 22px 22px 3px;padding:20px 22px 22px}
.order-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.order .date{font-size:14px;color:var(--muted);padding-top:4px}
.seal{width:74px;height:74px;flex:none}
.seal .arc{animation:draw 1s cubic-bezier(.3,.7,.2,1)}
@keyframes draw{from{stroke-dasharray:0 188.5}}
.order h1{font-weight:900;font-size:clamp(34px,9.5vw,48px);line-height:1.16;letter-spacing:.01em;margin:6px 0 10px}
.order .sub{font-family:var(--serif);font-size:18px;color:var(--muted)}
.order .sign{font-family:var(--serif);font-size:15px;color:var(--gold);text-align:right;margin:8px 0 18px}
.facts{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;font-size:14px;color:var(--muted)}
.facts b{font-family:var(--en);font-size:22px;font-weight:600;color:var(--ink);margin-right:3px}

/* continue */
.cont{display:flex;gap:16px;align-items:center;text-decoration:none;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cont .num{font-family:var(--en);font-size:44px;line-height:1;color:var(--gold);min-width:44px;text-align:center}
.cont strong{display:block;font-family:var(--serif);font-size:19px}
.cont span{font-size:14px;color:var(--muted)}
.meter{height:5px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--gold-2);border-radius:3px}

/* chapter list */
.chaps{list-style:none;margin:0;padding:0}
.chap{display:grid;grid-template-columns:62px 1fr auto;gap:2px 12px;align-items:baseline;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.chap .day{grid-row:span 2;font-size:13px;color:var(--muted);padding-top:3px}
.chap .ct{font-family:var(--serif);font-size:18px;font-weight:700}
.chap .meta{font-size:13px;color:var(--muted);grid-column:2}
.chap .st{grid-row:1 / span 2;grid-column:3;align-self:center;font-size:13px;padding:2px 10px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.st.done{background:var(--green-soft);color:var(--green)}
.st.reading{background:var(--gold-soft);color:var(--gold)}
.chap.next .ct{color:var(--gold)}

/* reader */
.back{display:inline-flex;align-items:center;gap:4px;font-size:14px;color:var(--muted);text-decoration:none;min-height:40px}
.back svg{width:18px;height:18px}
.rhead .day{font-size:14px;color:var(--gold);margin-top:6px}
.rhead h1{font-size:clamp(28px,7.5vw,36px);font-weight:900;line-height:1.25;margin-top:2px}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 22px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:14px;min-height:40px}
.switch .track{width:40px;height:24px;border-radius:12px;background:var(--sunk);position:relative;transition:background .2s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.switch[aria-checked="true"] .track{background:var(--green)}
.switch[aria-checked="true"] .track::after{transform:translateX(16px)}
.story p{font-family:var(--serif);font-size:18.5px;line-height:2.1;margin:0 0 1.2em;border-radius:8px;transition:background .3s,box-shadow .3s}
.story p.reading{background:var(--gold-soft);box-shadow:0 0 0 8px var(--gold-soft)}
.w{font-family:var(--en);font-style:italic;font-weight:500;font-size:1.14em;line-height:1.2;color:var(--ink);border-bottom:1.5px dashed var(--gold-2);padding:0 2px;margin:0 1px}
.w.seen{border-bottom-style:solid}
.w.saved{background:var(--gold-soft);border-radius:3px}
.wg{white-space:nowrap}
.g{font-family:var(--sans);font-size:.66em;color:var(--gold);margin-right:2px;vertical-align:.12em}
.nogloss .g{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--en);font-size:17px;padding:4px 12px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--line)}
.chip.seen{box-shadow:inset 0 0 0 1.5px var(--gold-2)}
.chip.known{background:var(--green-soft);box-shadow:none;color:var(--green)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:22px;font-size:14px}
.pager a{text-decoration:none;color:var(--muted);min-height:40px;display:inline-flex;align-items:center}

/* tags */
.tag{display:inline-block;font-size:12px;line-height:1.6;padding:0 8px;border-radius:5px;margin-right:4px}
.tag.i{background:var(--green-soft);color:var(--green)}
.tag.t{background:var(--gold-soft);color:var(--gold)}

/* word sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 22px calc(24px + env(safe-area-inset-bottom,0px));max-height:86vh;overflow:auto;transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.3,.7,.2,1),visibility 0s .28s}
.sheet.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.3,.7,.2,1)}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hw{font-family:var(--en);font-size:44px;font-weight:600;line-height:1.05;word-break:break-word}
.ipa{font-family:var(--en);font-size:19px;color:var(--muted)}
.mean{font-family:var(--serif);font-size:21px;font-weight:700;margin-top:10px}
.pos{font-family:var(--en);font-style:italic;font-weight:400;color:var(--gold);margin-right:8px}
.ex{margin-top:16px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.ex .en{font-family:var(--en);font-size:20px;line-height:1.45}
.ex .zh{color:var(--muted);font-size:14.5px;margin-top:4px}
.rel{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:16px 0 0;font-size:14px}
.rel dt{color:var(--muted)}
.rel dd{margin:0;font-family:var(--en);font-size:17px}
.sh-act{display:flex;gap:10px;margin-top:22px}
.sh-act .btn{flex:1}
.btn.on{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1.5px var(--gold-2)}
.btn.okd{background:var(--green-soft);color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}

/* quiz */
.qhead{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:6px}
.qword{font-family:var(--en);font-size:46px;font-weight:600;line-height:1.1;margin-top:18px}
.qsent{font-family:var(--en);font-size:22px;line-height:1.5;margin-top:16px}
.qask{font-size:15px;color:var(--muted);margin-top:4px}
.opts{margin-top:22px}
.opt{display:block;width:100%;text-align:left;padding:14px 18px;border-radius:14px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);margin-bottom:10px;font-size:17px}
.opt.en{font-family:var(--en);font-size:20px}
.opt.right{box-shadow:inset 0 0 0 2px var(--green);background:var(--green-soft);color:var(--green)}
.opt.wrong{box-shadow:inset 0 0 0 2px var(--rose);background:var(--rose-soft);color:var(--rose)}
.opt:disabled{cursor:default}
.fb{margin-top:8px;padding:14px 16px;border-radius:14px;background:var(--sunk);font-size:15px}
.fb b{font-family:var(--en);font-size:18px}
.score{font-family:var(--en);font-size:84px;line-height:1;font-weight:600;margin-top:20px}
.score small{font-size:34px;color:var(--muted)}
.verdict{font-family:var(--serif);font-size:24px;font-weight:700;margin-top:12px}

/* word list */
.search{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:16px}
.search::placeholder{color:var(--muted)}
.wl{list-style:none;margin:0;padding:0}
.wr{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.wbtn{flex:1;min-width:0;display:grid;grid-template-columns:auto 1fr;gap:0 10px;text-align:left;padding:12px 0}
.wk{font-family:var(--en);font-size:21px;font-weight:600}
.wi{font-family:var(--en);font-size:15px;color:var(--muted);align-self:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wz{grid-column:1 / -1;font-size:14.5px;color:var(--muted)}
.wz .ok{color:var(--green);margin-left:6px}
.empty{padding:28px 4px;color:var(--muted);font-size:15px}

/* cards */
.card{min-height:320px;background:var(--surface);border-left:4px solid var(--gold-2);border-radius:3px 22px 22px 3px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 22px;margin-top:14px;width:100%}
.card .hw{font-size:48px}
.card .mean{margin-top:16px}
.card .en{font-family:var(--en);font-size:19px;line-height:1.45;margin-top:16px}
.card .zh{color:var(--muted);font-size:14px;margin-top:4px}
.card .hint{font-size:13px;color:var(--muted);margin-top:18px}

/* stats */
.lead{font-family:var(--serif);font-size:22px;line-height:1.6}
.lead b{font-family:var(--en);font-size:34px;font-weight:600;color:var(--gold);margin:0 2px}
.exam{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:14px;margin-top:10px}
.exam .bar{height:9px;background:var(--sunk);border-radius:5px;overflow:hidden}
.exam .bar i{display:block;height:100%;border-radius:5px}
.chart text{font-family:var(--sans);font-size:10px;fill:var(--muted)}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px}
.vsel{max-width:100%;min-height:42px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;padding:0 10px}
.scorelist{list-style:none;margin:0;padding:0;font-size:15px}
.scorelist li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.scorelist span:last-child{font-family:var(--en);font-size:17px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
@supports (backdrop-filter:blur(8px)){.nav{background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}
.nav ul{display:flex;max-width:640px;margin:0 auto;padding:0;list-style:none}
.nav li{flex:1}
.nav a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 5px;font-size:12px;color:var(--muted);text-decoration:none}
.nav svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--ink);font-weight:500}
.nav a[aria-current="page"] svg{color:var(--gold)}

.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" tabindex="-1"></main>

<nav class="nav" aria-label="主選單">
  <ul>
    <li><a href="#home" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>首頁</a></li>
    <li><a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h6"/></svg>章節</a></li>
    <li><a href="#words" data-tab="words"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10a1 1 0 0 1 1 1v17l-6-4-6 4V4a1 1 0 0 1 1-1z"/></svg>生字本</a></li>
    <li><a href="#stats" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>進度</a></li>
  </ul>
</nav>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-word" tabindex="-1"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- dictionary: ipa, pos, zh, synonyms, antonyms, example en, example zh, exam (I=雅思 T=多益 B=兩者) ---------- */
const D={
interview:["ˈɪntərvjuː","n./v.","面試",["meeting","consultation"],[],"She prepared carefully for the job interview.","她為這次工作面試做了充分準備。","B"],
candidate:["ˈkændɪdət","n.","應徵者；候選人",["applicant","nominee"],[],"The company shortlisted three candidates for the position.","公司為這個職位篩選出三位候選人。","B"],
resume:["ˈrezəmeɪ","n.","履歷",["CV","profile"],[],"Please attach your resume to the application form.","請將履歷附在申請表上。","T"],
qualification:["ˌkwɑːlɪfɪˈkeɪʃən","n.","資格；學歷證照",["credential","certification"],["disqualification"],"A degree in finance is the minimum qualification for this role.","財務學位是這個職位的最低資格。","B"],
confident:["ˈkɑːnfɪdənt","adj.","有自信的",["assured","self-assured"],["insecure","timid"],"He sounded confident during the negotiation.","他在談判中聽起來很有自信。","B"],
impress:["ɪmˈpres","v.","使印象深刻",["amaze","dazzle"],["disappoint"],"Her detailed report impressed the board.","她詳盡的報告讓董事會印象深刻。","B"],
salary:["ˈsæləri","n.","薪水",["wage","pay","income"],[],"The starting salary is higher than the industry average.","起薪高於業界平均。","T"],
negotiate:["nɪˈɡoʊʃieɪt","v.","談判；協商",["bargain","discuss"],[],"We need to negotiate better terms with the supplier.","我們需要和供應商談出更好的條件。","B"],
reject:["rɪˈdʒekt","v.","拒絕；駁回",["refuse","turn down"],["accept","approve"],"The manager rejected the proposal without explanation.","經理沒有說明就駁回了提案。","B"],
persistent:["pərˈsɪstənt","adj.","堅持不懈的",["determined","tenacious"],["wavering","half-hearted"],"Persistent effort is the key to learning a language.","持之以恆的努力是學好語言的關鍵。","I"],
assistant:["əˈsɪstənt","n.","助理",["aide","secretary"],[],"His assistant manages his calendar and travel plans.","他的助理負責管理他的行程和差旅安排。","T"],
contract:["ˈkɑːntrækt","n.","合約",["agreement","deal"],[],"Both parties signed the contract on Friday.","雙方在週五簽署了合約。","T"],

shareholder:["ˈʃerhoʊldər","n.","股東",["stockholder","investor"],[],"Shareholders will vote on the new CEO next month.","股東們將在下個月投票選出新任執行長。","T"],

{t:"總裁的面試",p:[
"早上九點，林語晴抱著一份薄薄的{resume|履歷}，走進陸氏集團頂樓。今天是她第三次來{interview|面試}，前兩次都被人資{reject|拒絕}了。等候區坐滿了穿{brand|名牌}套裝的{candidate|應徵者}，每個人的{qualification|資格}看起來都比她漂亮。",

"「林語晴小姐，請進。」{secretary|秘書}推開那扇厚重的木門。總裁{office|辦公室}大得不像話，整面落地窗外是整座台北城，桌上只有一台筆電、一杯黑咖啡，和一疊她看不懂的報表。空氣裡有淡淡的木頭香，安靜得連她的心跳聲都聽得見。她忽然很想轉身逃走，雙腳卻還是往前走了。",
"門打開，坐在落地窗前的男人連頭都沒抬。「陸氏不缺{assistant|助理}。」陸景川翻著文件，「說一個我該用妳的理由。」林語晴深吸一口氣，努力讓自己看起來很{confident|有自信}：「因為我很{persistent|堅持不懈}。您拒絕我兩次，我還是來了。」",

"那天晚上，她把{alarm|鬧鐘}調到六點，又改成五點半。閉上眼睛前，她想起他最後那句「遲到一分鐘就扣薪」，忍不住笑了。她不知道的是，頂樓的辦公室燈還亮著，陸景川正看著她的{resume|履歷}，在她手寫的那句「我不怕被{reject|拒絕}」下面，用筆輕輕畫了一條線。"]},
{t:"董事會的風暴",p:[
"上班第一週，林語晴就遇上了{crisis|危機}。{quarterly|季度}報表顯示，集團的{revenue|營收}連續兩季{decline|下滑}，{shareholder|股東}們在董事會上吵成一片。",
"會議室裡，白髮蒼蒼的王董拍桌：「兩季{decline|下滑}，再這樣下去，明年的{shareholder|股東}大會要怎麼交代？」另一位董事附和，說應該立刻{layoff|裁員}、砍掉{development|研發}。林語晴坐在角落做紀錄，手指在{keyboard|鍵盤}上飛快地打字，偷偷抬頭看了陸景川一眼。他靠在椅背上，冷靜得像這場{crisis|危機}跟他無關。",
"會後，他把她叫進辦公室，丟給她一個隨身碟。「裡面是過去五年東南亞市場的資料，三天後的董事會要用。」林語晴打開檔案，倒抽一口氣：上千張{spreadsheet|表格}，{format|格式}全都不一樣。「三天？」「如果妳做不到，」他低頭簽文件，「我現在就可以{reject|拒絕}妳的{probation|試用期}。」她咬著牙把隨身碟收進口袋：「我做得到。」",
"那三天，林語晴幾乎住在公司。她把每一季的{revenue|營收}拆開比對，發現集團在越南和泰國的線上銷售，其實每年都成長三成，只是被台灣市場的衰退掩蓋了。凌晨兩點，茶水間的燈突然亮起，陸景川端著兩杯咖啡走進來，放了一杯在她桌上，什麼都沒說就離開了。",
"咖啡是溫的，加了兩包糖，剛好是她喜歡的甜度。林語晴盯著杯子發愣，想不通他怎麼會知道。後來她才發現，面試那天她在等候區喝的就是這種咖啡，而他只是從監視器裡看過一眼。她搖搖頭，把這件事拋到腦後，繼續整理{quarterly|季度}數據。",
"陸景川準備了一套新的{strategy|策略}，{propose|提議}把資源轉向東南亞市場。幾位老董事一臉{skeptical|懷疑}：「年輕人，憑什麼？」他沒有爭辯，只轉頭看向角落：「林助理，資料。」",
"林語晴熬了兩個通宵整理的{evidence|證據}，一頁頁投在螢幕上。數據比口才更能{convince|說服}人，提案在{deadline|截止期限}前一天獲得{approve|批准}。散會後，他低聲說：「做得好。不過下次要熬夜，先跟我報備。」",
"散會後，王董特地走到林語晴面前：「小姑娘，資料做得很漂亮。」他向來對年輕人最{skeptical|懷疑}，這句話讓整個祕書室都驚呆了。林語晴紅著臉道謝，一轉身就撞上陸景川的胸口。他低頭看她：「表現不錯，但別太得意，下一個{deadline|截止期限}是下週一。」",
"那天下班，她第一次準時離開公司。走到捷運站時，手機跳出一封郵件，寄件人是陸景川，主旨只有三個字：「加班費」。{attachment|附件}是一張簽好名的{receipt|單據}，金額剛好是三個通宵的時薪。林語晴站在人潮裡看了很久，最後回了一句：「謝謝總裁。」他秒回：「不客氣。早點睡，這是命令。」"]},
{t:"出差東京",p:[
"陸景川臨時決定親自去東京參加國際{conference|研討會}，林語晴連夜排好{itinerary|行程表}。偏偏{flight|班機}因{typhoon|颱風}{delay|延誤}三小時，她一手推著兩人的{luggage|行李}，一手不停改{schedule|時程}。",
"機場{lounge|貴賓室}裡，陸景川坐在角落，一邊開視訊會議，一邊用英文和美國的{shareholder|股東}說話。林語晴抱著筆電坐在他旁邊，替他把{conference|研討會}的資料重新排版。{boarding|登機}廣播一次又一次{delay|延後}，她偷偷算了算，到東京的時候已經是半夜了。",
"飛機終於起飛。林語晴累得靠在窗邊睡著，醒來時發現身上多了一條{blanket|毛毯}。陸景川正在看文件，連頭都沒抬：「空調太冷。妳的{presentation|簡報}稿掉在地上，我幫妳撿起來了。順便說一句，第五頁有個{typo|錯字}。」她抓起稿子一看，臉一下子紅到耳根。",
"到了飯店，櫃台說{reservation|預訂}出了錯，只剩一間房。林語晴正要另找{accommodation|住宿}，陸景川已經遞出黑卡：「{upgrade|升級}成套房，兩間臥室。」他看她一眼，「別想太多，我只是不想讓我的助理睡在大廳。」",
"套房比林語晴的租屋處大三倍，客廳中間還擺著一架白色鋼琴。她把兩人的{luggage|行李}推進各自的房間，又把明天的{schedule|時程}印出來，貼在冰箱上。回頭時，她看見陸景川站在窗前，望著東京鐵塔的燈光發呆，背影竟然有點寂寞。",
"「總裁，您還不睡嗎？」「睡不著。」他轉過身，「我母親是日本人，小時候我常來東京。她過世以後，我就再也沒有在這裡過夜。」林語晴不知道該說什麼，只好泡了一杯熱可可給他。他接過杯子，低聲說了一句日文。她聽懂了，那是「謝謝」。",
"隔天的{presentation|簡報}，日方{colleague|同事}臨時缺席，現場沒人能{translate|翻譯}。林語晴舉手：「我大學在日本{exchange|交換}過，我來。」那是她第一次到{abroad|國外}出差，也是陸景川第一次在台下，專心地只看一個人。",
"簡報結束，日方{representative|代表}握著陸景川的手，笑著說：「您的{assistant|助理}日文說得比我們的{colleague|同事}還好。」合作案當場敲定，比原本的{deadline|截止期限}提早了一個月。回飯店的路上，陸景川破天荒地讓司機繞去淺草，說要帶她看看真正的東京。",
"夜晚的淺草寺點著燈籠，林語晴站在雷門下拍照，陸景川在一旁替她拿包包。她忽然想起，幾個月前她還只是一個被{reject|拒絕}了兩次的應徵者，現在卻和總裁一起站在{abroad|異國}的街頭。「在想什麼？」他問。她搖頭笑了：「在想這個月的{salary|薪水}，到底值不值得。」"]},
{t:"那杯咖啡",p:[
"回台北的第一天早上，新來的{intern|實習生}在{elevator|電梯}口一個踉蹌，把整杯拿鐵{spill|灑}在陸景川身上。那是一套義大利{tailor|裁縫}手工訂製、非常{expensive|昂貴}的{suit|西裝}。實習生臉色慘白，不停{apologize|道歉}。",
"電梯口瞬間安靜下來。實習生叫小周，才來第二天，手上還拿著要送去{finance|財務部}的{invoice|請款單}，現在全濕透了。所有人都屏住呼吸，因為大家都聽說過，上一個弄髒總裁文件的人，隔天就被調去{warehouse|倉庫}。林語晴下意識地往前一步，擋在小周和陸景川之間。",
"全辦公室都以為他會發火。陸景川卻只是脫下外套：「不用{compensate|賠償}，也不用開{invoice|請款單}。」實習生{insist|堅持}要賠，他淡淡地說：「那就把這份報告重做一次，做到我滿意為止。」",
"小周抱著報告，眼眶泛紅地走了。林語晴跟著陸景川走進辦公室，從櫃子裡拿出備用襯衫。「這套西裝送洗要多久？」她問。「不用送了，」他把外套丟進垃圾桶，「咖啡漬洗不掉的。」林語晴看著那套至少二十萬的西裝，心疼得說不出話。",
"「您真的不讓他{compensate|賠償}？」「他一個月的實習薪水，連一隻袖子都賠不起。」陸景川扣上新襯衫的扣子，「與其讓他背債，不如讓他學會把事情做好。」林語晴第一次發現，這個人說話雖然難聽，心卻不是冷的。她對他的看法，悄悄改變了一點點。",
"林語晴{curious|好奇}地看著他：「總裁今天這麼{generous|大方}？」他有點{reluctant|不情願}地承認：「三年前，有個女生也把咖啡灑在我身上，還理直氣壯地說，那間店沒有{refund|退款}，所以她不賠。」林語晴愣住了。那個女生，好像就是她。這真的只是{coincidence|巧合}嗎？",
"記憶像潮水一樣湧上來。三年前的冬天，她在一間咖啡店打工，一個穿黑色大衣的男人一直在講電話，她轉身時不小心把整杯美式灑在他身上。男人皺著眉要她賠，她卻理直氣壯地說，店裡沒有{refund|退款}，打翻的咖啡也算已售出。男人愣了一下，竟然笑了。",
"「原來是你……」林語晴脫口而出。陸景川挑眉：「妳終於想起來了？」她的臉燒得發燙：「所以您當初{hire|錄取}我，是為了{revenge|報仇}？」「不，」他把一杯新的拿鐵推到她面前，「是因為敢跟我講道理的人，很少見。這杯我請，不用{apologize|道歉}。」",
"那天下午，小周把重做的報告放在桌上，整整齊齊，連{punctuation|標點}都檢查過。陸景川看完只說了一個字：「好。」小周激動得差點哭出來。林語晴在旁邊偷笑，心想這位總裁雖然難搞，其實比誰都{generous|大方}。"]},
{t:"併購案",p:[
"陸氏正在談一樁{merger|合併}案，對手是{industry|業界}最大的{competitor|競爭對手}周氏。就在簽約前夕，一份{confidential|機密}文件被{leak|洩漏}給{media|媒體}，{acquisition|收購}價格一夕曝光。",
"消息曝光那天早上，陸氏的股價一開盤就下跌。周氏趁機{bargain|壓價}，要求重新{negotiate|談判}條件。陸景川一整天都在會議室裡，臉色鐵青。林語晴替他擋掉了三十通記者電話，最後一通是周氏董事長打來的，語氣得意得讓人想摔電話。",
"傍晚，{personnel|人資}主管把林語晴叫進小會議室，門一關，氣氛就變了。「這份{confidential|機密}文件，只有五個人看過。」主管把一張名單推過來，「妳是其中之一。這兩天請妳先不要碰任何合約。」林語晴看著名單上自己的名字，手心一片冰冷。",
"董事會要求徹底{investigate|調查}。有人開始{suspect|懷疑}林語晴，因為她是少數碰過那份文件的人。耳語越傳越難聽，她甚至不知道該怎麼證明自己的{loyal|忠誠}。",
"那幾天，同事們看她的眼神都變了。茶水間裡，有人故意大聲說：「難怪升得這麼快，原來是吃裡扒外。」林語晴假裝沒聽到，回到座位繼續整理資料。只有小周偷偷塞給她一個便當，小聲說：「語晴姐，我相信妳。」",
"晚上十點，她還在加班，想找出文件是從哪裡流出去的。她比對每一份{file|檔案}的{print|列印}紀錄，終於發現一個奇怪的地方：外洩的那個{version|版本}，有一頁數字和正式版不一樣，而那個錯誤版本，只寄給過財務部。她抬起頭，才發現陸景川不知道什麼時候站在她身後，手裡拿著同一份{evidence|證據}。",
"陸景川把所有人叫進會議室，把調查報告摔在桌上：「真正{betray|背叛}公司的，是收了周氏好處的財務副總。」他環視眾人，「誰還想毀掉她的{reputation|名聲}，先想清楚{consequence|後果}。」散會後，林語晴小聲說謝謝。他說：「我信的不是妳的話，是妳的{integrity|正直}。」",
"財務副總被帶走時，經過林語晴的座位，停下來冷笑：「妳以為他在保護妳？他只是在保護陸氏的{reputation|名聲}。」林語晴沒有回答。她只記得剛才在會議室裡，陸景川說相信她的時候，連一秒都沒有遲疑。",
"一週後，{merger|合併}案順利簽約，周氏只拿到原本一半的條件。{banquet|慶功宴}上，陸景川舉杯向全公司宣布：「這次能守住，要感謝一位最{loyal|忠誠}的同事。」所有人都轉頭看向林語晴。她握著酒杯，第一次覺得這間公司的燈光，暖得讓人想哭。"]},
{t:"總裁生病了",p:[
"併購案結束後，陸景川連續工作了三十六個小時，終於在會議中倒下。醫生說{symptom|症狀}是{overwork|過勞}加上胃炎，開了{prescription|處方}，叮嚀他睡眠要{sufficient|充足}、注意{nutrition|營養}。",
"救護車的{siren|鳴笛}聲響徹整條街。林語晴坐在車裡，握著陸景川冰冷的手，{heartbeat|心跳}快得像要從胸口跳出來。醫生問她病人最近吃了什麼，她才發現，這兩週她只看過他喝黑咖啡，偶爾吞下一顆胃藥。她第一次後悔，自己身為{assistant|助理}，竟然沒注意到這些。",
"急診室外，陸家的{butler|管家}匆匆趕來，看見林語晴才鬆了一口氣：「少爺從小就這樣，只要工作一忙，三餐全都{ignore|不管}。」他嘆氣，「夫人過世以後，就再也沒有人管得動他了。」林語晴看著{ward|病房}裡那張蒼白的臉，暗暗下了一個決定。",
"「我沒事，晚上還有視訊會議。」他靠在病床上，臉色{exhausted|疲憊}，語氣卻依舊{stubborn|固執}。林語晴把他的筆電收走：「您總是{ignore|忽視}自己的身體。現在您的{priority|首要任務}只有一個，就是{recover|康復}。」",
"陸景川瞪著她：「妳是我的助理，不是我的{nurse|護士}。」「那您可以{dismiss|開除}我。」林語晴把筆電鎖進自己的包包，「但在您{recover|康復}之前，所有會議我都會延後，所有郵件我都會代回。這是醫生的命令，不是我的。」他氣得說不出話，最後只好躺回床上，背對著她。",
"第二天早上，她提著保溫瓶走進病房。粥是她凌晨四點起床熬的，加了南瓜和小米，聽說對胃最好。陸景川本來不想吃，看到她眼下的黑眼圈，還是默默喝完了一碗。護理師進來量{temperature|體溫}時，笑著說：「陸先生，您女朋友真細心。」兩個人同時嗆到。",
"沒有人能{persuade|說服}陸景川，除了她。那一週，她每天帶著自己熬的粥來醫院。他的氣色{gradually|逐漸}好轉。某天晚上，他忽然開口：「林語晴，我很{appreciate|感謝}妳。」停了一下，又補一句：「粥太淡了，明天多放點鹽。」",
"出院那天，陸景川恢復了總裁的樣子，西裝筆挺、表情冷淡。但林語晴發現，他的辦公桌上多了一個便當盒，每天中午十二點，祕書都會準時送一份重視{nutrition|營養}的午餐進去。連董事們都在私下議論，說總裁生了一場病，好像變得比較有人味了。",
"某天下午，林語晴桌上出現一個小盒子，裡面是一支新手機，和一張紙條：「舊手機螢幕裂了，對眼睛不好。這不是禮物，是工作需要。」她拿起手機，發現通訊錄裡只存了一個號碼，備註是「老闆」。她笑著把備註改成了「{stubborn|固執}的病人」。"]},
{t:"慈善晚宴",p:[
"陸氏是年度{charity|慈善}晚宴的主要{sponsor|贊助商}，{venue|場地}選在山頂的玻璃宴會廳。林語晴原本只負責流程，出門前卻收到一個禮盒：一件{elegant|優雅}的深藍色{gown|禮服}，和一張卡片，「今晚的{formal|正式}場合，妳是我的女伴。」",
"禮服剛好合身，像是量身訂做的。林語晴站在鏡子前，幾乎認不出自己。{makeup|化妝師}一邊替她盤頭髮，一邊說：「陸總特地交代，妝不要太濃，他說妳本來的樣子就很好看。」她的臉一下子紅了，心想這一定是化妝師在開玩笑。",
"宴會廳裡衣香鬢影，政商{celebrity|名流}都到了。林語晴挽著陸景川的手臂走進去，立刻感覺到四面八方的目光。有人竊竊私語，猜她是哪家的千金；有人認出她是助理，眼神裡帶著{contempt|輕蔑}。陸景川低聲說：「抬頭。妳今天不是來工作的，是來陪我的。」",
"晚宴的重頭戲是{auction|拍賣}，所得全數{donate|捐}給偏鄉學校。一條{necklace|項鍊}起標價十萬，周家少爺一路加價，還{provoke|挑釁}地看了林語晴一眼。陸景川舉牌，一次{bid|出價}到三百萬，全場安靜。",
"周家少爺臉色一陣青一陣白，最後放下牌子，冷笑著離開座位。主持人激動地敲下木槌，全場響起掌聲。林語晴小聲問：「您花三百萬買一條項鍊，不怕被股東罵嗎？」陸景川面不改色：「這是做{charity|慈善}，股東只會說我{image|形象}很好。而且，」他看了她一眼，「它很適合妳。」",
"晚宴進行到一半，林語晴到{balcony|露台}透氣。山下的城市燈火閃爍，風吹得她有點冷。身後傳來腳步聲，一件西裝外套輕輕披在她肩上。「不舒服？」「沒有，」她搖頭，「只是覺得像在做夢。三年前我還在咖啡店打工，現在卻穿著禮服，站在這種地方。」",
"這場拍賣{generate|募得}的善款創下紀錄。散場時，他把項鍊戴在她頸上：「這只是個小小的{gesture|心意}。」他看著她，語氣難得{sincere|真誠}，「我想讓妳知道，三年前那杯咖啡，給我留下了很深的{impression|印象}。」",
"林語晴摸著頸上的項鍊，說不出話。陸景川望著遠方，語氣難得溫柔：「那天妳灑了我一身咖啡，還說沒有{refund|退款}。我回到公司，第一次記住一個陌生人的臉，想了一整個晚上。」他轉頭看她，「後來在面試名單上看到妳的名字，我就知道，這不是{coincidence|巧合}。」",
"宴會結束，司機在門口等著。陸景川替她拉開車門，自己卻沒有上車。「我還有事，妳先回家。」車子開動後，林語晴從後照鏡裡看見他一個人站在山頂的夜風裡，拿著手機講了很久的電話。她不知道，那天晚上他打給了祖父，說他想帶一個人回家。"]},
{t:"最後的提案",p:[
"年底，林語晴第一次獨立提出{proposal|提案}：把集團旗下的商場改造成{sustainable|永續}綠建築，減少對{environment|環境}的衝擊。這個想法很{innovative|創新}，但需要龐大的{budget|預算}。",
"這個想法，來自她小時候住的老{community|社區}。夏天總是熱得睡不著，冷氣一開，{electricity|電費}就讓媽媽皺眉。林語晴想，如果商場屋頂能種滿{plant|植物}、牆面裝上太陽能板，不但能省電，還能讓附近的居民有地方乘涼。她熬了一個月，把企劃書改了十七個版本。",
"提案會議前一晚，她緊張得睡不著，傳訊息給陸景川：「如果被{reject|拒絕}怎麼辦？」三分鐘後，他回覆：「那就再提一次。妳不是說過，妳很{persistent|堅持不懈}嗎？」她盯著那行字，想起面試那天的自己，笑著把手機貼在胸口，終於睡著了。",
"董事們擔心{risk|風險}太高，沒人願意{invest|投資}。陸景川在會議上站起來：「我要和林語晴一起{collaborate|合作}這個案子，用我個人的名義擔保。」最後，計畫以三年為期，正式通過。",
"計畫通過後，真正的挑戰才開始。工程延誤、廠商抬價，附近的店家也抱怨{construction|施工}太吵。林語晴每天戴著{helmet|安全帽}跑工地，曬得像換了一個人。陸景川常常在傍晚出現，帶著兩杯冰咖啡，陪她坐在工地的鐵架上，看{sunset|夕陽}慢慢沉進城市裡。",
"有一天，他忽然問：「妳為什麼這麼拚？」林語晴想了想：「因為我想證明，{sustainable|永續}不是有錢人的{slogan|口號}，而是真的能讓普通人過得更好的方法。」她轉頭看他，「也想證明，您當初{invest|投資}在我身上的{risk|風險}，是值得的。」陸景川沒說話，只是伸手把她的安全帽扶正。",
"開幕那天，商場的屋頂花園擠滿了人。老人坐在樹蔭下下棋，孩子們在草地上奔跑，電費{bill|帳單}比去年少了四成。記者們搶著採訪，問這個{innovative|創新}的設計是誰想出來的。陸景川把麥克風推到林語晴面前：「問她。我只負責簽{budget|預算}。」",
"一年後，綠色商場{achieve|達成}了所有節能目標，林語晴也被{promote|升職}為永續發展總監。慶功宴上，陸景川單膝跪下，拿出的不是戒指，而是一份新的合約：「終身{partnership|合作關係}，條款由妳寫。」她笑著問：「這是命令嗎？」他說：「不，這次是請求。妳願意對我{commit|許下承諾}嗎？」",
"全場安靜了三秒，接著爆出掌聲和尖叫。林語晴的眼淚掉個不停，接過他手中的筆，在合約最後一頁簽下自己的名字。陸景川站起來，把她抱進懷裡，在她耳邊說：「這次，我不會再讓妳等了。」窗外的城市燈火通明，像在替他們慶祝。"]},
{t:"見家長",p:[
"答應求婚的第二天，陸景川說要帶林語晴回老家。陸家是百年{enterprise|企業}，最重視{tradition|傳統}。他的祖父手握集團最高{authority|權力}，個性出了名的{conservative|保守}。",
"陸家老宅在陽明山上，車子開過一段長長的林蔭道，才看到那棟灰瓦白牆的大房子。門口站著一排{servant|傭人}，整齊得像在迎接外國元首。林語晴低頭看了看自己的洋裝，那是她特地去買的，現在卻覺得怎麼看都不夠正式。",
"「別緊張，」陸景川替她理了理頭髮，「爺爺雖然嚴格，但不吃人。」「您確定？」她小聲問，「我聽說上一個來見他的{heiress|千金}，當場就被嚇哭了。」他想了一下：「那是因為她說錯話。妳只要記得一件事，不管他說什麼，都不要{retreat|退縮}。」",
"「爺爺一直希望我{inherit|繼承}家族的{heritage|傳承}，娶一位門當戶對的千金。」他牽著她的手，「如果妳想{hesitate|猶豫}，現在還來得及。」林語晴搖頭：「我答應過的事，從不反悔。」",
"晚餐前，祖母拉著林語晴到{garden|花園}散步。老太太穿著一身素色旗袍，笑容很溫和：「景川從小就{stubborn|固執}，決定的事誰也改不了。他媽媽走後，這孩子就把自己關起來，只剩下工作。」她握住林語晴的手，「這幾個月，他打電話回家的次數，比過去五年加起來還多。」",
"家宴隆重得像一場{ceremony|典禮}。祖父打量她很久，才開口：「嫁進陸家不是{privilege|特權}，是{obligation|義務}。妳承受得了這樣的{expectation|期望}嗎？」林語晴還沒回答，陸景川已經握緊她的手{reassure|安撫}她：「爺爺，以後不管她去哪裡，我都會{accompany|陪著}她。這件事，我不是來問您意見的。」",
"餐桌上一片死寂。祖父放下筷子，看了孫子很久，最後竟然笑了：「你跟你父親一模一樣。當年他也是這樣，帶著你媽媽站在我面前。」他轉向林語晴，「丫頭，陸家的規矩很多，妳要學的還多得很。不過，我欣賞有{backbone|骨氣}的人。」",
"離開老宅時已經是深夜。祖父親自送他們到門口，從口袋裡拿出一個小木盒，交給林語晴。裡面是一只翡翠{bracelet|手鐲}，顏色溫潤得像一汪春水。「這是景川奶奶當年的嫁妝，」老人說，「現在，它是妳的了。」林語晴捧著盒子，手微微發抖。",
"回程的車上，她一直盯著那只手鐲。「爺爺這樣算是答應了嗎？」陸景川握著方向盤，嘴角上揚：「在陸家，手鐲比任何{contract|合約}都有效。」他頓了頓，「不過就算他不答應，我也不會改變主意。我說過，我是很{persistent|堅持}的人。」她白了他一眼：「那是我的{script|台詞}。」"]},
{t:"記者會",p:[
"{engagement|訂婚}的消息還沒公開，{internet|網路}上就出現{rumor|謠言}，說林語晴是靠心機才得到總裁的心。幾十位{journalist|記者}守在陸氏大樓外，公關部連夜擬好{statement|聲明}。",
"謠言越傳越離譜。有人說她偷看過總裁的私人{correspondence|信件}，有人說她故意在東京製造獨處機會，甚至有{netizen|網友}挖出她大學時的照片，嘲笑她「變化真大」。林語晴整晚刷著{comment|留言}，手指越來越冷。她從來不知道，原來一群陌生人可以這麼討厭一個人。",
"凌晨一點，{doorbell|門鈴}響了。陸景川站在門口，手上提著一袋她最愛的鹹酥雞。「妳已讀不回十七次了，」他把袋子塞給她，「不准再看留言。」林語晴想笑，眼淚卻先掉了下來。他嘆了口氣，把她拉進懷裡：「明天的記者會，交給我。」",
"記者會上，台下的{audience|聽眾}擠滿{flash|閃光燈}。有人不停{interrupt|打斷}發言，追問她是不是「心機助理」。這場{controversy|爭議}越吵越大，公關經理勸陸景川先{deny|否認}婚事，減少負面{publicity|曝光}。",
"一名{journalist|記者}舉手，語氣尖銳：「陸總，您不怕這段婚姻影響陸氏的{reputation|聲譽}嗎？」台下一陣騷動。公關經理在後台急得直搓手，拚命比手勢要陸景川照稿念。林語晴站在台側，深吸一口氣，準備迎接最糟的結果。",
"陸景川卻直接走上台，{announce|宣布}：「我和林語晴下個月結婚。」他看著鏡頭，語氣冷靜：「我想{clarify|澄清}一件事。她的每一次升職都有公開紀錄，流程完全{transparent|透明}。各位可以批評我，但對她的{criticism|批評}，到此為止。」",
"會場安靜了整整五秒，接著爆出此起彼落的快門聲。陸景川轉身，向台側伸出手。林語晴愣了一下，在無數鏡頭前走上台，把手放進他的掌心。他低頭看她，用只有她聽得到的聲音說：「這次，換我來保護妳。」",
"記者會的影片在網路上瘋傳，一天就破了千萬點閱。原本罵她的網友紛紛改口，說這是「年度最霸氣{confession|告白}」。更多人翻出她過去的工作紀錄，發現她曾經為了一份{presentation|簡報}連續熬夜三天，還在東京替公司談下大單。留言區的風向，一夜之間全變了。",
"晚上，公關經理傳來一份報告，說陸氏的品牌好感度創下新高，連股價都漲了兩個百分點。林語晴看著數字，忍不住問：「您早就算好了，對不對？」陸景川正在看文件，頭也不抬：「我只算到一件事，就是妳會哭。」他把面紙盒推到她面前，「果然。」"]},
{t:"工廠的意外",p:[
"{wedding|婚禮}前一個月，南部{facility|廠區}突然傳出警報。一台老舊{equipment|設備}起火，數百名員工必須緊急{evacuate|疏散}。陸景川丟下會議，親自開車南下。",
"{highway|高速公路}上，陸景川把車開得飛快。林語晴坐在副駕駛座，一手抓著扶手，一手打電話聯絡醫院和消防隊。電話那頭傳來廠區主任慌亂的聲音，背景全是警報聲和哭喊聲。她努力讓自己冷靜，把每一個數字都記下來：受困人數、受傷人數，還有幾個人{missing|下落不明}。",
"他們趕到時，火勢已經控制住了。工廠外的空地上，數百名員工裹著毯子，臉上全是灰。一位年輕媽媽抱著安全帽哭個不停，說她的丈夫還沒出來。陸景川二話不說，戴上消防隊的{mask|面罩}就要往裡面衝，被林語晴死命拉住：「您是董事長，不是{firefighter|消防員}！」",
"好消息很快傳來：最後一名員工在倉庫裡被找到了，只是被{smoke|煙}嗆暈，送醫後就醒了過來。那位年輕媽媽撲進丈夫懷裡，哭得說不出話。陸景川站在旁邊，低聲交代林語晴：「所有受傷員工的醫療費，全部由公司負擔。他們的家人，也要有人照顧。」",
"調查發現，廠長為了壓低{cost|成本}，跳過好幾次{maintenance|維修}，還{forge|偽造}安全{inspection|檢查}報告，嚴重{violate|違反}政府{regulation|法規}。幸好這次{emergency|緊急狀況}中，只有兩名員工輕微{injury|受傷}。",
"媒體追問誰該負責，陸景川第一個站出來：「我是董事長，這件事由我{responsible|負責}。」他承諾全面汰換有{hazard|危險}的機台。林語晴在旁邊補充：「安全和{efficiency|效率}並不衝突。省下的成本，不能拿員工的安全來換。」",
"記者會結束後，陸景川在工廠住了一個禮拜。他親自走過每一條生產線，聽每一位老師傅說哪台機器的聲音不對、哪個開關常常卡住。林語晴跟在旁邊做紀錄，寫滿了整整三本筆記本。她從來沒想過，一個坐在頂樓的總裁，會願意蹲在油污裡聽工人說話。",
"一個月後，所有老舊{equipment|設備}都換成了新的，廠區也通過了最嚴格的{inspection|檢查}。新任廠長是一位在工廠做了三十年的老師傅，上任第一天就在門口貼了一張大字報：「安全第一，沒有第二。」員工們說，這是他們第一次覺得，公司真的把他們當人看。",
"回台北的車上，林語晴靠著車窗睡著了。陸景川把冷氣調小，替她蓋上外套。等紅燈時，他低頭看著她手裡還緊緊握著的筆記本，封面上寫著一行小字：「每一個數字背後，都是一個家。」他看了很久，悄悄拿出手機，拍下了這句話。"]},
{t:"新加坡分公司",p:[
"為了打開東南亞{market|市場}，陸氏決定在新加坡{establish|設立}{subsidiary|子公司}，由林語晴全權負責。她必須在三個月內{relocate|調派}團隊、{recruit|招募}在地人才，還要說服各國的{branch|分公司}配合。",
"出發前一晚，林語晴在{suitcase|行李箱}前坐了很久。這是她第一次獨自帶領一個團隊，到一個完全陌生的國家。陸景川靠在門邊看她收行李：「怕嗎？」「怕。」她老實回答，「但更怕錯過。」他走過來，替她把那件最常穿的外套摺好，放進箱子最上層。",
"新加坡的天氣又熱又濕，一下飛機，眼鏡就起了一層霧。林語晴租了一間小辦公室，第一週就面試了上百位{candidate|應徵者}。她發現當地人做事講求效率，開會從不拖泥帶水，但對外來的主管也帶著幾分防備。她決定先放下{headquarters|總部}特助的身分，從學習當地文化開始。",
"最大的挑戰是{logistics|物流}。當地倉儲的{infrastructure|基礎建設}不足，產品{supply|供應}跟不上市場{demand|需求}。她連續兩週睡在辦公室，把整個{regional|區域}配送網重新規劃了一遍。",
"某天深夜，倉庫打電話來，說一批貨被卡在{customs|海關}。林語晴連夜趕去{port|港口}，用英文、中文和一點點馬來語跟海關人員溝通，總算在天亮前把貨放行。走出港口時，太陽剛好升起，她累得坐在路邊，卻發現自己笑得停不下來。",
"她的團隊漸漸成形：負責{marketing|行銷}的是一位印度裔媽媽，管財務的是剛畢業的華人男孩，倉儲主管是一位講話很大聲的馬來大叔。大家說著不同的語言，卻為了同一個目標團結在一起。每週五晚上，林語晴都會請大家去小販中心吃雞飯，那是整個團隊最期待的時刻。",
"新品{launch|發表}那天，第一批貨三小時就賣光。陸景川從台北飛來，站在會場最後一排。「我說過，妳會比我更早把版圖{expand|擴張}到海外。」他遞給她一杯熱拿鐵，「這次拿穩，別灑在我身上。」",
"那天晚上，團隊在酒店頂樓開慶功宴。馬來大叔喝多了，拉著陸景川說：「老闆，你的未婚妻很厲害，你要好好對她。」大家哄堂大笑。陸景川難得沒有冷著臉，認真地回答：「我知道。所以我打算讓她當這裡的{regional|區域}{manager|總經理}。」林語晴嘴裡的飲料差點噴出來。",
"宴會散場後，兩人沿著濱海灣{stroll|散步}。夜風帶著海水的味道，遠方的摩天輪閃著彩色的光。林語晴問：「您剛才說的是真的嗎？」「我從不在員工面前開玩笑。」陸景川停下腳步，「但妳要答應我一件事：不管多忙，每個週末都要回台北。我們的婚禮還沒辦。」"]},
{t:"她回來了",p:[
"慶功宴上來了一位不速之客：蘇曼妮，陸景川的青梅竹馬，也是周氏新任{executive|執行長}。她{ambitious|野心勃勃}，美麗又強勢，一進門就把林語晴當成{rival|對手}。",
"蘇曼妮穿著一身火紅的禮服，所到之處，人群都自動讓開一條路。她和陸景川同年，從小在同一個社區長大，十八歲去美國讀書，畢業後在華爾街闖出名號。現在她回到台灣接下周氏，第一個目標就是陸氏。業界都說，這兩個人遲早要正面{showdown|對決}。",
"「景川，你當年說過要娶我。」蘇曼妮在眾人面前挽住他的手臂。這明顯是{deliberate|故意}的挑釁，她想{manipulate|操弄}所有人的看法。林語晴臉上帶著微笑，心裡卻有點{jealous|吃醋}，空氣中瀰漫著{tension|緊張}。",
"「蘇小姐，」林語晴放下酒杯，笑容不變，「聽說您在美國主修金融，那您一定知道，口頭{promise|承諾}在{law|法律}上是沒有效力的。」周圍的人愣了一下，有人忍不住笑出聲。蘇曼妮的臉色僵了一秒，隨即鬆開陸景川的手，優雅地舉杯：「林小姐果然很會說話，難怪能從{assistant|助理}一路升上來。」",
"宴會後半場，蘇曼妮一直跟在陸景川身邊，聊他們小時候的事。她記得他怕狗、不吃{cilantro|香菜}，還記得他十歲那年為了救一隻小鳥，從樹上摔下來斷了手。每一個故事，都是林語晴不知道的過去。她站在人群裡，第一次覺得自己像個{outsider|局外人}。",
"回到飯店，兩人第一次爆發{conflict|衝突}。林語晴決定{confront|當面問清楚}：「她說的是真的嗎？」陸景川沉默很久，才{confess|坦白}：「那是我們七歲時說的話。」他難得{emotional|激動}起來，「我知道妳會{misunderstand|誤會}，但我需要妳的{trust|信任}。」",
"林語晴沒有說話。她想起這一年來，他陪她熬過的每一個夜晚：東京的熱可可、醫院的白粥、新加坡港口的{sunrise|日出}。她知道，比起那些她不知道的過去，她更應該相信他們一起走過的現在。她走過去，輕輕抱住他：「我不生氣了。但下次她再挽你的手，你要自己抽開。」",
"第二天一早，陸景川就打電話給蘇曼妮，語氣冷淡得像在談公事：「曼妮，我們是老朋友，但如果妳再用這種方式接近我的未婚妻，周氏和陸氏之間，就不會只是{competitor|競爭對手}這麼簡單。」電話那頭沉默了很久，最後傳來一聲輕笑：「景川，你變了。」",
"掛掉電話後，他走到落地窗前。祕書送來最新的消息，說周氏正在大量收購陸氏的散股。陸景川看著報告，眼神慢慢冷了下來。他知道，蘇曼妮不是會輕易認輸的人。一場更大的{storm|風暴}，正在城市的另一端悄悄成形。"]},
{t:"股價暴跌",p:[
"蘇曼妮的報復來得很快。周氏放出{misinformation|假消息}，陸氏{stock|股票}一天之內{plunge|暴跌}百分之十五。全球正處於{recession|經濟衰退}，{inflation|通膨}又居高不下，市場本來就極度{volatile|不穩定}。",
"那則假新聞寫得煞有其事，說陸氏在新加坡的分公司{loss|虧損}嚴重，還附上一張偽造的財務報表。早上九點開盤，賣單像{avalanche|雪崩}一樣湧進來。林語晴盯著螢幕上一路往下的線，手腳冰冷：那些數字，分明是她親手做的報表，卻被改得面目全非。",
"{trader|交易員}的電話一通接一通，董事們在群組裡吵成一團，連祖父都從陽明山打電話來，問到底發生了什麼事。陸景川把所有電話都轉給祕書，自己關在辦公室裡，對著三台螢幕一言不發。林語晴推門進去時，看見他桌上的咖啡已經冷了，一口都沒喝。",
"投資人陷入{panic|恐慌}，{analyst|分析師}紛紛調降{rating|評等}，甚至有媒體預言陸氏會{bankrupt|破產}。董事會要求陸景川出售海外{asset|資產}來償還{debt|債務}。",
"會議室裡吵得不可開交。王董主張先賣掉東京的大樓救急，其他人則建議裁員兩成。陸景川一直沒開口，直到林語晴走進來，把一疊資料放在他面前。他低頭翻了幾頁，抬頭看她，眼裡第一次露出了笑意。",
"那份資料是新加坡分公司真正的{ledger|帳本}，每一筆{transaction|交易}都有銀行對帳單可以佐證。林語晴把它和假新聞上的報表並排，一眼就能看出哪裡被動了手腳。「造假的人很聰明，」她說，「但他不知道，我習慣在每份報表的頁尾，藏一個只有我看得懂的編號。」",
"「不能賣。」林語晴拿出新加坡分公司的報表，「我們的營收{forecast|預測}其實在成長，只是市場被嚇壞了。」她建議集團公開所有數據，再由陸景川個人加碼買回股票。一週後，股價逐漸{stabilize|穩定}下來。陸景川說：「妳又救了我一次。」",
"陸景川召開記者會，公開所有真實數據，並宣布個人買進十億元的陸氏股票。「我對這間公司有信心，」他說，「也對我的團隊有信心。」那一刻，原本觀望的投資人紛紛回頭，股價當天就止跌回升。財經媒體稱讚這是教科書等級的{crisis|危機}處理。",
"一個月後，調查結果出爐：假新聞的源頭，是周氏旗下的一家公關公司。蘇曼妮被董事會約談，{suspend|暫停}職務三個月。消息傳來時，林語晴正在幫陸景川泡咖啡。他接過杯子，淡淡地說：「我說過，她不會輕易認輸。」他喝了一口，「但這次，她輸給了妳。」"]},
{t:"她的創業夢",p:[
"風波過後，林語晴向陸景川說出一個{secret|秘密}：她一直想當{entrepreneur|創業家}，做一個幫偏鄉孩子學英文的App。她已經默默做出{prototype|原型}，還申請到一項{patent|專利}。",
"這個想法藏在她心裡很久了。小時候，她住在花蓮的山上，學校只有一位英文老師，要教全校六個年級。她靠著一台二手{radio|收音機}和一本破舊的{dictionary|字典}，一個字一個字地自學英文。她一直想，如果偏鄉的孩子手上都有一個好老師，該有多好。",
"陸景川聽完，沉默了很久。「為什麼不早點告訴我？」「因為我怕您說這不賺錢。」林語晴低下頭，「我知道它很難賺錢，但我還是想做。」他伸手抬起她的下巴：「語晴，我是商人，但我不是只看錢的人。如果妳想做，我只有一個要求：不准{quit|半途而廢}。」",
"「我想靠自己，不想用你的錢。」她想證明自己是{independent|獨立}的。可是新事業的{obstacle|障礙}比想像中多：{capital|資金}不足、使用者{survey|調查}結果不理想，{profit|利潤}更是遙遙無期。",
"最難熬的是第一次{fundraising|募資}{presentation|簡報}。她站在十幾位投資人面前，講到一半，{projector|投影機}突然當機。台下有人開始滑手機，有人直接起身離開。林語晴手心全是汗，但她深吸一口氣，關掉投影機，用白板筆畫出了整個App的{framework|架構}。最後，只有一位投資人留下來，跟她要了名片。",
"那位投資人姓吳，是一位{retire|退休}的國小校長。他說，他在偏鄉教了三十年書，看過太多孩子因為學不好英文，就放棄了讀書的機會。「我不懂科技，」老校長說，「但我看得出來，妳是真心想幫這些孩子。」他{invest|投資}的金額不多，卻讓林語晴在公園長椅上哭了整整一個小時。",
"陸景川沒有出手，只是每天晚上陪她看使用者{feedback|回饋}，像{mentor|導師}一樣陪她一起修改。半年後，這個{venture|事業}拿到第一筆外部投資。他說：「我從第一天就知道，妳的{potential|潛力}不只是當我的助理。」",
"第一批使用者是花蓮山上的三十個孩子。林語晴親自上山，教他們怎麼用App學單字。一個綁著馬尾的小女孩，第一次唸對 apple 的時候，興奮得跳起來抱住她。那天晚上，林語晴傳了一張照片給陸景川，照片裡是三十張笑得燦爛的臉。",
"他回覆：「這是我今年看過最好的財報。」過了一會兒，又傳來一句：「下週的董事會，想請妳來做一場報告，主題是企業社會責任。陸氏想和妳建立第一個企業{partnership|合作關係}。」林語晴盯著螢幕，正想拒絕，下一則訊息又跳出來：「這次不是我出錢，是董事會投票通過的。」"]},
{t:"山區的暴風雪",p:[
"為了替App找偏鄉合作學校，兩人開車上山。沒想到山區{climate|氣候}變化劇烈，{blizzard|暴風雪}突然來襲。他們被困在{remote|偏遠}的村落，手機收不到{signal|訊號}，完全{isolated|與外界隔絕}。",
"雪越下越大，車子在山路上{skid|打滑}，最後卡在一個彎道動彈不得。陸景川試著倒車，輪胎卻只在雪地裡空轉。外面一片白茫茫，連前方十公尺都看不清楚。林語晴看了看油表，又看了看手機上那格微弱得幾乎消失的訊號，心一點一點往下沉。",
"「我們不能待在車上，」陸景川冷靜地說，「油用完就沒有暖氣了。剛才經過的地方有一個村子，走過去大概二十分鐘。」他從後車廂拿出{flashlight|手電筒}、毯子和一袋餅乾，把{scarf|圍巾}一圈一圈繞在她脖子上。「抓緊我的手，不管發生什麼事，都不要放開。」",
"氣溫降到零下，連{pipe|水管}都{freeze|結凍}了。他們在一間廢棄小學找到{shelter|避難處}。陸景川把外套披在她身上，冷靜地分配食物：「我們要{conserve|節省}體力和電力，等{rescue|救援}隊來。」",
"小學的教室裡還留著孩子們的畫，牆上貼著一張泛黃的世界地圖。陸景川在角落找到一個舊暖爐，又從倉庫翻出幾塊{firewood|木柴}。火光亮起來的那一刻，林語晴終於鬆了一口氣。她看著牆上的地圖，忽然想到，這間學校，也許正是她的App最需要去的地方。",
"第二天，雪還是沒停。他們把剩下的餅乾分成六份，一天只吃兩份。陸景川把大部分的毯子都蓋在她身上，自己只披著一件外套。林語晴半夜醒來，發現他坐在火爐邊，嘴唇凍得發紫，卻還在替她守夜。她忍不住罵他：「您是{stubborn|固執}，還是笨？」",
"那一夜很長。林語晴第一次看見他{vulnerable|脆弱}的一面：「我從小什麼都不用{rely|依賴}別人，直到遇見妳。」他們{endure|撐過}了三天，最後靠一張舊地圖{navigate|找路}下山。看見救援車燈的那一刻，她說：「只要跟你在一起，什麼我們都能{survive|挺過去}。」",
"救援{captain|隊長}拍著陸景川的肩膀說，他們能撐這麼久，全靠那個暖爐和兩人的冷靜。「很多人遇到這種情況會{panic|驚慌}，」隊長說，「一亂跑，就很難找到了。」林語晴裹著毯子坐在救護車裡，看著那間小學漸漸消失在雪霧中，在心裡默默記下了它的名字。",
"三個月後，那間小學收到了一批新電腦、一套暖氣設備，還有林語晴的App終身免費使用權。開學那天，孩子們在黑板上畫了兩個大人手牽手站在雪地裡，旁邊歪歪扭扭地寫著：「謝謝叔叔阿姨。」陸景川看著照片，難得笑出聲：「叔叔？我有那麼老嗎？」"]},
{t:"總裁學做菜",p:[
"回到台北，陸景川宣布了一個驚人的決定：他要學做菜，理由是「上次在醫院，妳的粥太淡」。他買了最貴的{organic|有機}{ingredient|食材}，照著網路{recipe|食譜}，想{imitate|模仿}米其林主廚的法式{cuisine|料理}。",
"星期六早上，管家驚恐地看著一{truck|卡車}的食材被搬進廚房：法國空運的鴨胸、日本的和牛、義大利的{truffle|松露}，還有一整箱不知道怎麼用的{spice|香料}。陸景川穿著全新的{apron|圍裙}，表情嚴肅得像要開董事會。「今天的{menu|菜單}是油封鴨腿和紅酒燉牛肉，」他宣布，「誰都不准幫忙。」",
"第一次{attempt|嘗試}就把廚房搞得一團亂。{steak|牛排}燒焦，{sauce|醬汁}太鹹，完全{ruin|毀了}原本的{flavor|風味}。管家站在門口不敢說話，林語晴卻笑得停不下來。",
"煙霧警報器響了三次。第三次響的時候，連警衛都跑來敲門，問是不是失火了。陸景川站在一片狼藉的廚房中間，頭髮上沾著{flour|麵粉}，臉頰上有一道醬汁，看起來像剛打完一場仗。他盯著鍋子裡那塊黑漆漆的東西，認真地問：「這個，還能吃嗎？」",
"林語晴笑到肚子痛，好不容易才停下來。她捲起袖子，把燒焦的鍋子泡進水裡：「總裁，做菜跟經營公司一樣，不能一開始就想用最難的{strategy|策略}。」她從冰箱裡拿出兩顆蛋，「我們從最簡單的開始。先學會控制火候，再談油封鴨腿。」",
"她耐心地教他從煎蛋開始。向來高高在上的總裁，第一次變得{humble|謙虛}又{patient|有耐心}，連蛋殼都挑得一乾二淨。那天晚餐的{portion|份量}只有一小盤，她卻吃得特別慢。「很好吃。」這句{compliment|稱讚}，比任何董事會的掌聲都讓他開心。",
"從那天起，陸家的廚房成了兩人週末的秘密基地。陸景川學會了番茄炒蛋、三杯雞，還有林語晴媽媽的獨門滷肉。他做菜的樣子跟工作時一模一樣，每個步驟都要寫下來，每種調味都要精準到公克。林語晴笑他：「您是在做菜，還是在寫{contract|合約}？」",
"一個月後，陸景川主動提出要煮一頓晚餐，招待她的爸媽。那天他從早上就開始準備，林語晴想進廚房幫忙，被他趕了出來。晚餐上桌時，林媽媽嚐了一口滷肉，眼眶突然紅了：「這個味道，跟我媽媽做的一模一樣。」陸景川的手微微發抖，比面對任何一場談判都緊張。",
"飯後，林爸爸把陸景川叫到陽台。這個在花蓮種了一輩子田的男人，話不多，只是拍了拍他的肩膀：「我女兒從小就倔，吃了很多苦。你要是敢讓她哭，我就從花蓮扛著鋤頭上台北。」陸景川站得筆直，認真地點頭：「伯父，我保證，她以後只會笑著哭。」"]},
{t:"婚禮籌備",p:[
"婚禮決定在峇里島舉辦。林語晴親自{coordinate|協調}所有{detail|細節}，從場地、{catering|餐飲}到花藝{vendor|廠商}，每天光是要回的郵件就有上百封。",
"婚紗店的{clerk|店員}第一次看到這麼挑剔的新郎。林語晴試了二十幾套婚紗，陸景川每一套都說「還可以」，直到她穿上一件簡單的白色緞面禮服走出來。他盯著她看了很久，久到店員都開始緊張，最後才開口：「就這件。」他別過頭去，耳根紅得像要燒起來。",
"陸景川原本想把婚禮{arrange|安排}得極盡{luxury|奢華}，她卻希望簡單一點。兩人各退一步：保留海邊{ritual|儀式}，但只寄出一百張{invitation|邀請函}。每位賓客的飲食{preference|偏好}也都記下來，誰{vegetarian|吃素}、誰不吃海鮮，一個都沒漏。",
"賓客名單是最難搞定的部分。祖父堅持要邀請所有生意夥伴，林家只想請幾位{relative|親戚}和山上的老{neighbor|鄰居}。兩邊的名單加起來，足足有八百人。林語晴熬了三個晚上，最後想出一個辦法：婚禮只請最親近的一百人，回台灣後再辦一場感恩餐會，讓所有人都有機會祝福。",
"出發前一週，小周跑來找林語晴，手裡抱著一個大紙盒。「語晴姐，這是全公司一起準備的。」盒子裡是一本厚厚的{album|相簿}，每一頁都是同事們寫的祝福，還有她進公司以來的照片：面試那天緊張的背影、東京{conference|研討會}上翻譯的側臉、工廠裡戴著安全帽的樣子。她一頁一頁翻著，眼淚止不住地掉。",
"婚禮前三天，颱風逼近，飯店建議{postpone|延期}。所有人都看向陸景川。「不用延。」他拿出另一套方案，「我早就{estimate|估計}過天氣風險，室內場地已經{confirm|確認}好了。」最後{attendance|出席率}是百分之百，賓客們一起{decorate|佈置}新場地，大家都說，沒見過這麼{flexible|靈活}的總裁。",
"新場地是一座臨海的老教堂，彩色玻璃窗外就是翻騰的大海。賓客們把原本準備放在沙灘上的鮮花，一束一束搬進教堂，掛滿了每一排木椅。風雨打在窗戶上，教堂裡卻溫暖得像春天。牧師笑著說，他主持了四十年婚禮，第一次看到賓客自己動手佈置場地。",
"林爸爸牽著女兒的手，一步一步走向聖壇。他的手很粗糙，是種了一輩子田的手。走到陸景川面前時，他停下來，把女兒的手交出去，聲音沙啞：「交給你了。」陸景川緊緊握住，對著老人深深鞠了一個躬。台下的林媽媽和祖母同時拿出手帕，一起哭成了淚人。",
"交換誓詞時，陸景川拿出一張紙，上面密密麻麻寫滿了字。他清了清喉嚨，唸出第一句：「我，陸景川，承諾遵守以下十二條{contract|合約}條款。」全場笑成一片。林語晴一邊笑一邊擦眼淚，聽他一條一條唸完，最後一條是：「每天早上，為妳泡一杯不會灑出來的咖啡。」"]},
{t:"周氏的反擊",p:[
"蜜月回來第一天，陸氏就收到一份{lawsuit|訴訟}。周氏{accuse|指控}林語晴的App{plagiarize|抄襲}他們的{technique|技術}，要求天價賠償。蘇曼妮在記者面前說得信誓旦旦，好像握有確切證據。",
"新聞一出，林語晴的App{download|下載}量一夜之間掉了一半。{parent|家長}們在留言區議論紛紛，有人說原來是抄來的，有人說難怪那麼快就做出來。合作的偏鄉學校也打電話來，小心翼翼地問，是不是該先暫停使用。林語晴握著電話，第一次覺得自己快要撐不下去了。",
"吳校長是第一個來找她的人。老人家坐了三個小時的火車，從花蓮趕到台北，只為了當面跟她說一句話：「孩子，我{trust|相信}妳。我們山上的孩子，也相信妳。」他從{backpack|背包}裡拿出一疊信，全是孩子們寫的，歪歪扭扭的字跡寫著：「老師，不要放棄。」",
"陸氏的首席{attorney|律師}建議{settle|和解}，以免夜長夢多。林語晴卻堅持：「我是{innocent|無辜}的，我要上法庭{defend|捍衛}自己。」她拿出完整的開發紀錄和專利文件，一頁一頁準備答辯。",
"準備{trial|開庭}的那一個月，林語晴幾乎沒睡過一個完整的覺。她把三年來所有的開發紀錄、每一次修改的時間、每一封和{engineer|工程師}往來的郵件，全部整理成冊。陸景川把書房讓給她當作戰室，每天晚上陪她核對到深夜。「累了就靠著我睡一下，」他說，「我幫妳看。」",
"開庭前一晚，有人敲門。門外站著一位年輕男子，戴著黑框眼鏡，神情緊張。他說自己曾經在周氏的研發部工作，因為不肯配合偽造文件，被迫離職。「我手上有證據，」他說，「但我很怕。周氏的律師很厲害，我不知道站出來會有什麼{consequence|後果}。」",
"開庭當天，關鍵{witness|證人}出現了，是周氏的前工程師。他出庭{testify|作證}，揭露這起訴訟其實是一場{fraud|詐欺}，證據全是偽造的。法官當庭作出{verdict|判決}，周氏敗訴。走出法院時，蘇曼妮低聲說：「我很{guilty|內疚}。」林語晴看著她：「遲來的{justice|正義}，也還是正義。」",
"法院外擠滿了記者。林語晴走出大門時，閃光燈此起彼落。一位記者問她，要不要反告周氏{slander|誹謗}。她想了想，搖搖頭：「不用了。我只希望大家把注意力，放回那些需要學英文的孩子身上。」那天晚上，App的下載量不但恢復了，還比之前多了三倍。",
"一週後，蘇曼妮辭去周氏執行長的職務。離開台灣前，她寄了一封信給林語晴，信裡只有短短幾行字：「我輸了。不是輸給陸景川，而是輸給妳的{integrity|正直}。我想去一個沒有人認識我的地方，重新開始。」林語晴把信讀了兩遍，輕輕放進抽屜裡。"]},
{t:"十年之約",p:[
"十年後，陸氏集團迎來創立一百年的{anniversary|週年紀念}。林語晴的{education|教育}App已經幫助了五十萬個孩子，那是她人生最重要的{milestone|里程碑}。",
"這十年，發生了很多事。陸景川接下祖父的位子，成為陸氏集團的{chairman|董事長}；林語晴的App從三十個孩子開始，擴展到東南亞七個國家。他們有了一對{twin|雙胞胎}，哥哥像爸爸一樣嚴肅，妹妹像媽媽一樣愛笑。每天早上，家裡的廚房都會飄出咖啡香。",
"百年慶典辦在當年那棟大樓的頂樓。林語晴站在落地窗前，看著底下熟悉的街道。十年前，她就是在這裡，抱著一份薄薄的{resume|履歷}，緊張得手心冒汗。現在，那間總裁辦公室已經改成了員工{library|圖書館}，門口掛著一塊小木牌，寫著：「堅持不懈，必有回響。」",
"典禮上，陸景川把{microphone|麥克風}交給她。她說：「我想{reflect|回顧}這十年。一個人能留下的{legacy|影響}，不是賺了多少錢，而是{inspire|啟發}了多少人。」她希望下一個{generation|世代}的孩子，都有機會學好英文、看見世界。",
"台下坐著許多熟悉的面孔。當年的實習生小周，現在是陸氏的財務長；新加坡的馬來大叔帶著全家飛來，嗓門還是一樣大；吳校長已經八十歲了，坐在第一排，拄著拐杖，笑得比誰都開心。最讓林語晴意外的，是最後一排那位戴著{sunglasses|墨鏡}的女士：蘇曼妮。",
"典禮結束後，蘇曼妮走到她面前，摘下墨鏡。她在非洲做了八年的教育{volunteer|志工}，皮膚曬黑了，眼神卻變得很柔和。「我在那裡用的，就是妳的App，」她說，「孩子們都很喜歡。」兩個女人看著彼此，終於相視而笑。過去的恩怨，在那一刻全都煙消雲散。",
"致詞的最後，林語晴請一位特別的來賓上台：當年山上那個綁著馬尾的小女孩。她現在十七歲了，剛考到雅思七點五分，{apply|申請}上英國的大學。女孩用流利的英文說：「十年前，我第一次唸對 apple 的時候，林老師抱住了我。從那天起，我就知道，世界比山還大。」全場起立鼓掌。",
"台下，陸景川帶著兩個孩子為她鼓掌。她向所有曾經{contribute|貢獻}的人表達{gratitude|感激}，最後看向他：「{ultimately|說到底}，改變我一生的，是一場面試和一杯咖啡。」他走上台，在她耳邊說：「我們對彼此的{influence|影響}是{mutual|互相}的。妳說過，那份合約是終身制。」「不，」她笑著糾正，「是{eternal|永恆}的。」",
"那天晚上，孩子們睡著以後，陸景川走進廚房，泡了兩杯拿鐵。他把其中一杯小心翼翼地放在她面前，一滴都沒有灑出來。「十年了，」他說，「這杯咖啡，我終於學會拿穩了。」林語晴捧著杯子，靠在他肩上。窗外的城市燈火，一如當年那樣溫暖。"]},
{t:"颱風夜的櫃台",p:[
"颱風登陸的那一晚，台北老牌的雲棲酒店擠滿了{stranded|滯留}的{traveler|旅客}。夜班{receptionist|櫃台接待員}許知夏已經連續站了六個小時。她在{hospitality|餐旅}業做了四年，從沒見過這麼混亂的夜晚，電話一通接一通，每一通都在問同一個問題：還有沒有空房。",
"「我要見你們經理！」一位穿名牌西裝的男人把房卡摔在櫃台上。他的房間因為系統出錯被{overbook|超額預訂}，現在只能跟陌生人共用{bathroom|浴室}。許知夏深吸一口氣，記下他的{complaint|客訴}，微笑著說：「先生，經理正在處理淹水的{parking|停車場}，這件事由我來{handle|處理}。」",
"她打了七通電話，終於在附近的姊妹飯店找到房間，還請司機冒雨送他過去。「造成您的{inconvenience|不便}，我們非常抱歉，今晚的房費由飯店全額吸收。」男人原本漲紅的臉慢慢消了氣，臨走前甚至跟她說了聲謝謝。",
"凌晨一點，大廳的自動門滑開，一個渾身濕透的男人走進來。他沒帶傘，黑色大衣滴著水，手裡只有一個{briefcase|公事包}。「一間房，」他說，「什麼房都可以。」許知夏看了看電腦，整間飯店已經沒有任何{vacancy|空房}。",
"男人的語氣很冷：「五星級飯店，連一間房都擠不出來？」換作別人可能早就不耐煩了，許知夏只是遞給他一條乾{towel|毛巾}：「先生，今晚確實沒有{available|可用}的客房。不過頂樓有一間員工休息室，床很小，但很乾淨。」",
"她帶他上樓，換了新{linen|床單}，又從廚房端來一碗熱薑湯。男人站在門口看她忙進忙出，忽然問：「妳每次都這麼{courteous|有禮貌}嗎？就算客人很無理？」許知夏想了想：「客人無理，通常是因為他遇到了困難。我的工作，就是讓困難少一點。」",
"男人沉默了一下，又提出一個{request|要求}：明天早上六點，要一杯黑咖啡和三份當天的{newspaper|報紙}。許知夏一一記下，笑著說：「我{guarantee|保證}六點整送到，一分鐘都不會晚。」",
"天亮時，颱風走了。許知夏準時把咖啡和報紙送到頂樓，房間卻已經空了。床鋪摺得整整齊齊，桌上壓著一張名片和一張紙條：「謝謝妳的{patience|耐心}。」名片上只有一個名字：程以安。",
"她把名片隨手放進口袋，沒有多想。直到早班同事尖叫起來，她才知道，程以安是程氏酒店集團的總裁，也就是雲棲酒店真正的老闆。而她昨晚，讓集團總裁睡在員工休息室裡，還給他喝了一碗薑湯。"]},
{t:"微服出巡的總裁",p:[
"整個早上，許知夏都在等著被開除。可是人資沒有找她，經理也沒有。中午時，飯店收到集團總部的{notice|通知}：程總裁將以{anonymous|匿名}的方式，在雲棲酒店住一個月，親自{evaluate|評估}這間老飯店的{operation|經營}狀況。",
"「匿名？他昨晚已經被我看光了。」許知夏小聲抱怨。好友小葵在一旁偷笑：「說不定他就是想看看，沒人認得他的時候，我們的{staff|員工}會是什麼樣子。」",
"果然，接下來的日子，程以安每天都換一種{disguise|偽裝}：有時候是戴棒球帽的{backpacker|背包客}，有時候是拄著拐杖的老先生。只有許知夏一眼就認得出來，因為不管穿什麼，他走路的樣子都像在巡視自己的{territory|領土}。",
"他像{detective|偵探}一樣{observe|觀察}每一個細節：餐廳的盤子有沒有缺角，房務員有沒有在{corridor|走廊}上大聲聊天，櫃台人員對每一位{customer|顧客}是不是一視同仁。他把每一件事都寫在一本黑色筆記本裡。",
"一週後，他把許知夏叫進咖啡廳。「妳在這裡工作四年，告訴我，雲棲最大的問題是什麼？」許知夏猶豫了一下，決定說實話：「我們的服務不夠{consistent|穩定}。白天和晚上，好像是兩間不同的飯店。」",
"「說下去。」「白班的主管只在乎業績，夜班的人手永遠不夠。」她越說越順，「客人不在乎我們的{marble|大理石}地板有多貴，他們在乎的是，凌晨三點按服務鈴的時候，有沒有人用好的{attitude|態度}回應。」",
"程以安合上筆記本：「如果讓妳改，妳會怎麼做？」「我會{recommend|建議}先補足夜班人力，再訂一套所有班別都一樣的服務{standard|標準}。」她頓了頓，「還有，把大廳那盞吵得要命的{chandelier|水晶燈}修好。」",
"程以安看了她很久，久到她開始後悔自己話太多。最後他站起來，丟下一句：「好的{quality|品質}不難做到，難的是每天{maintain|維持}。」然後就走了，連咖啡都沒喝完。",
"那天晚上，許知夏在員工休息室裡越想越不安，懷疑自己是不是說得太直接了。小葵安慰她：「放心啦，總裁要開除妳的話，早就開除了。」她嘆了口氣，把那張颱風夜留下的名片從口袋裡拿出來，盯著上面的名字看了很久，最後還是小心地夾進了筆記本裡。",
"那天晚上，大廳的水晶燈換新了。第二天，夜班多了三位新同事。第三天，許知夏的信箱裡出現一封來自總部的郵件，主旨是：「關於妳的升遷面談」。她盯著螢幕，手裡的筆掉在了地上。"]},
{t:"升職的條件",p:[
"面談在集團總部頂樓進行。程以安開門見山：「總部有一個儲備幹部計畫，為期半年。這是難得的{opportunity|機會}，結束後，妳有可能成為雲棲的副總經理。」許知夏愣住了：「可是我只是一個櫃台接待員。」",
"「我不看{title|職稱}，我看能力。」他把一份文件推過來，「計畫包含飯店管理{training|訓練}、每週一次的{workshop|研習}，還有國外分店的{internship|實習}。最後會有一次正式的績效{appraisal|考核}，不及格就回原單位。」",
"消息傳開後，雲棲的櫃台{supervisor|主管}林姐很不高興。她在員工會議上冷冷地說：「有些人以為會倒咖啡就能當主管。」許知夏低著頭沒說話。她知道，在別人眼裡，自己不過是{luck|運氣}好。",
"訓練比想像中辛苦。白天上課，學財務、人資和行銷；晚上還要回雲棲值夜班。同期的學員大多是名校畢業的管理{consultant|顧問}，只有她連試算表都要從頭學起。第一次{quiz|小考}，她拿了全班最後一名。",
"那天深夜，她在空蕩蕩的{classroom|教室}裡練習做報表，一個人默默掉眼淚。門口忽然傳來聲音：「哭完了嗎？」程以安靠在門邊，手裡拿著兩個便當，「哭完就吃飯。{skill|技能}可以學，飯不能不吃。」",
"他沒有教她怎麼做報表，只是坐在旁邊陪她吃完便當。「妳知道我為什麼選妳嗎？」他說，「颱風那天晚上，妳沒有等主管下{instruction|指示}，就自己想辦法解決問題。這種{initiative|主動}，是教不來的。」",
"從那天起，許知夏像變了一個人。她每天提早兩小時到教室，向每一位講師請教問題，連午休都在背財務名詞。三個月後，她的{performance|表現}從最後一名進步到前三名，連最挑剔的財務講師都說，她是最{competent|能幹}的學員。",
"期末考核那天，評審之一竟然是林姐。她看著許知夏的報告，表情複雜，最後在評分表上寫下一行字：「她{deserve|值得}這個位置。」離開會議室時，林姐低聲說：「之前是我看錯妳了。好好做，別讓我們夜班的人丟臉。」",
"結業典禮上，程以安親自頒發{certificate|證書}，宣布許知夏將{transfer|調任}回雲棲擔任副總經理。台下掌聲雷動，她卻只看見他嘴角那一抹淺淺的笑。後來她才明白，他是全世界最不會{motivate|激勵}人的老闆，卻一直用最笨的方式在幫她。"]},
{t:"米其林危機",p:[
"許知夏上任的第一個月，雲棲的法式餐廳剛拿到米其林一星。慶祝晚宴才過三天，就有十二位客人在{dine|用餐}後上吐下瀉。消息很快傳開，媒體用斗大的標題寫著：五星飯店爆發{poisoning|食物中毒}。",
"衛生局的{inspector|稽查員}一早就到了。廚房被封鎖，所有食材都要送檢。主{chef|廚}老吳在雲棲做了二十年的法國料理，他站在{freezer|冷凍庫}前，雙手發抖：「不可能，我的廚房是全台北最乾淨的。」",
"這場{outbreak|爆發}讓{booking|訂房}率一夜之間掉了三成。董事會要求立刻開除老吳，給社會一個交代。程以安打電話給許知夏：「妳是副總，這件事由妳決定。」她握著電話，看著窗外的記者，第一次感覺到這個職位有多重。",
"「給我三天，」她說，「調查結果出來之前，我不會開除任何人。」她先宣布餐廳{temporary|暫時}停業，再親自打電話向每一位生病的客人道歉，並承擔所有醫療費用。",
"接著，她帶著老吳檢查廚房的每一個角落。廚房的{hygiene|衛生}紀錄完美無缺：每一份食材都按規定{refrigerate|冷藏}，過期的醬料每天都會{dispose|丟棄}，連抹布都分成五種顏色。老吳對衛生的要求，比法規還要{strict|嚴格}。",
"老吳在一旁看著她翻遍每一個角落，忍不住說：「副總，妳不用這麼辛苦。董事會要的，只是有一個人出來負責。」許知夏頭也不抬：「我要的不是有人負責，是{truth|真相}。如果連真相都不在乎，下一次還會有人生病。」老吳愣了一下，默默捲起袖子，陪她一起查。",
"第二天深夜，許知夏在監視器畫面裡發現一個奇怪的地方：晚宴那天，製冰機壞了，有人臨時從外面叫了一批冰塊。送冰塊的廠商，是{procurement|採購}部經理的親戚，根本沒有通過任何檢驗。",
"檢驗報告證實了她的推測：是那批冰塊{contaminate|污染}了{appetizer|開胃菜}裡的冷湯。採購經理被移送{prosecute|法辦}，飯店也因為使用不合格的廠商，被處以高額{penalty|罰款}。許知夏沒有爭辯，第一時間就繳清了罰款。",
"餐廳重新開幕前，她訂下一套新規定：所有外部食材都必須經過檢驗，任何{precaution|預防措施}都不能因為趕時間而省略。「我們要{ensure|確保}，」她在員工大會上說，「這種事永遠不會再發生。」",
"重新開幕那天，第一位客人是程以安。老吳親自為他上菜，眼眶紅紅的：「總裁，謝謝您沒有開除我。」程以安指了指對面的許知夏：「要謝就謝她。我只負責簽罰款的單子。」許知夏瞪了他一眼，他卻低頭笑著喝湯。"]},
{t:"老飯店的改建",p:[
"雲棲酒店建於一九六五年，是台北第一批國際觀光飯店。{brick|紅磚}外牆、木頭旋轉門、大廳裡那座古老的{bell|銅鐘}，見證了這座城市半個世紀的變化。可是在董事會眼裡，它只是一棟又老又貴的建築。",
"「把它{demolish|拆掉}，蓋一棟四十層的商辦大樓。」程家二伯在董事會上說，「這塊地值一百億，留著一棟老飯店，根本是浪費。」不少董事點頭附和。許知夏坐在會議室最後一排，指甲深深掐進手心。",
"散會後，她攔住程以安：「您真的要拆嗎？」「這是商業決定。」他的語氣很平靜，「除非妳能給我一個更好的方案。」許知夏沒有回答，轉身就走。那天晚上，她在飯店倉庫裡翻了一整夜，找出了一九六五年的原始{blueprint|藍圖}。",
"原來，雲棲的{designer|設計師}是一位留學日本的台灣{architect|建築師}，大廳的挑高和{courtyard|中庭}的天井，都是當年最前衛的設計。這棟建築在台灣{architecture|建築}史上，其實是一個重要的{landmark|地標}。她查遍資料，發現它完全符合申請{historic|歷史}建築的條件。",
"一個月後，她在董事會上提出新方案：不拆，而是{renovate|翻修}。「我們可以{preserve|保留}紅磚外牆和大廳，」她指著投影片，「把客房全面{modernize|現代化}，再把頂樓改成景觀餐廳。歷史，就是我們最好的品牌。」",
"二伯冷笑：「說得好聽，錢從哪裡來？」許知夏早有準備：「文化部對歷史建築的修繕有{subsidy|補助}，我也已經找到三家願意合作的{contractor|承包商}。」她把{quotation|報價單}一張一張發下去，「總成本只有新建大樓的三分之一。」",
"會議室裡吵了整整兩個小時。最後，程以安提出一個{compromise|折衷}方案：主建築保留並修繕，後方的停車場改建成新的會議中心。投票結果七比五通過。散會時，二伯經過許知夏身邊，丟下一句：「小丫頭，妳等著看。」",
"申請建築{permit|許可}花了半年，施工又花了一年。許知夏幾乎每天都到工地，看著{craftsman|工匠}們一塊一塊{restore|修復}老舊的紅磚，把那座停擺了二十年的銅鐘重新上油。程以安常在傍晚出現，陪她站在鷹架下，什麼都不說。",
"完工那天，銅鐘在大廳裡重新響起。許知夏站在旋轉門前聽著鐘聲，眼淚忽然掉了下來。程以安遞給她一條手帕：「妳哭什麼？」「我爺爺年輕的時候，在這裡當過門房。」她笑著擦眼淚，「他說，這是全世界最美的飯店。」"]},
{t:"觀光季",p:[
"雲棲重新開幕後，第一個挑戰是即將到來的觀光旺季。許知夏翻著去年的數據，發現一個問題：台北的{tourism|觀光}人潮年年成長，{foreign|外國}旅客卻幾乎都住在信義區的新飯店，很少人會特地來雲棲。",
"「我們不能只賣房間，」她在行銷會議上說，「要賣一種{experience|體驗}。」她提議把雲棲包裝成一個{destination|目的地}，而不只是過夜的地方：大廳的銅鐘、頂樓的老照片，甚至爺爺當年當門房的故事，都可以是吸引人的{attraction|景點}。",
"她親自設計了一本旅遊{brochure|手冊}，介紹飯店周邊的老街、{temple|廟宇}和{snack|小吃}攤。每一頁都附上英文和日文的介紹，最後一頁是一張手繪{map|地圖}，標記著她從小吃到大的店家。",
"程以安翻了翻手冊，挑眉問：「這些地方，妳都去過？」「當然。」「那妳帶我去。」他把手冊塞回她手裡，「我要{explore|探索}一下，確認妳沒有亂寫。」許知夏愣了一下，忍不住笑了：「總裁，您這是在約我嗎？」他轉身就走，耳朵卻紅了。",
"那個週末，他們從大稻埕走到迪化街。程以安第一次吃滷肉飯配貢丸湯，第一次在廟口排隊買麻糬，也第一次知道，台北有這麼多他從沒注意過的{alley|巷子}。「這才是{authentic|道地}的台北，」許知夏說，「不在百貨公司裡，在這些老店裡。」",
"走到一間老雜貨店時，她買了一個手工做的小銅鐘{keychain|鑰匙圈}。「這可以當飯店的{souvenir|紀念品}，」她說，「讓客人把雲棲帶回家。」程以安接過鑰匙圈看了很久，最後默默放進自己的口袋，再也沒有還給她。",
"旺季來臨，雲棲的訂房率突破九成。{peak|旺季}期間，大廳{crowded|擠滿}了拿著手冊的外國旅客，有人在銅鐘前拍照，有人排隊等著參加飯店的老街導覽。許知夏忙得連午餐都沒時間吃，臉上卻一直帶著笑。",
"更讓她驚喜的是，附近的老店生意也跟著變好了。滷肉飯阿伯說，這個月的{turnover|營業額}是去年的兩倍；雜貨店老闆娘特地送來一籃水果道謝。觀光帶動了整條街的{economy|經濟}，連里長都跑來說要頒感謝狀給她。",
"旺季結束那天，程以安在董事會上宣布，雲棲的老街導覽將成為集團所有飯店的固定活動，不再只是{seasonal|季節性}的促銷。他看著報表說：「{cultural|文化}底蘊，是最難被複製的競爭力。」許知夏坐在台下，覺得那句話好像是說給她一個人聽的。"]},
{t:"葡萄酒莊",p:[
"為了替雲棲的法式餐廳挑選新酒單，程以安決定親自去法國波爾多一趟，並讓許知夏同行。「我不懂酒，」她說。「所以才要妳去，」他頭也不抬，「懂的人太多了，我需要一個能說真話的人。」",
"他們拜訪的第一座{vineyard|葡萄園}，已經傳了五代。莊主是一位滿頭白髮的老先生，帶著他們走在一排排{grape|葡萄}藤之間。正值秋天的{harvest|收成}季節，工人們戴著{straw|草帽}，把一串串紫色的葡萄放進{basket|籃子}裡。",
"老先生蹲下來，抓起一把{soil|土壤}給他們看：「這裡的土裡有很多{gravel|碎石}，白天吸收熱氣，晚上慢慢釋放。葡萄要在這種土裡{cultivate|栽種}，味道才會有層次。」許知夏聽得入迷，拿出筆記本一字一句地記下來。",
"在{cellar|地窖}裡，老先生解釋葡萄汁如何在{barrel|橡木桶}中{ferment|發酵}，再慢慢熟成。他倒了兩杯紅酒，讓他們閉上眼睛聞。「有黑莓，還有一點點……咖啡？」許知夏不確定地說。老先生驚訝地拍手：「小姐，妳的鼻子很好！這就是我們最驕傲的{aroma|香氣}。」",
"程以安看著她，眼裡有一絲驚訝。接下來幾天，他們拜訪了十幾座酒莊。許知夏發現，自己雖然說不出專業術語，卻能{distinguish|分辨}每一款酒的細微差別。有一位品酒師甚至開玩笑說，要挖角她去當{apprentice|學徒}。",
"最後一天，老先生從地窖深處拿出一瓶積滿灰塵的酒。「這是一九六五年的{vintage|年份酒}，」他說，「全世界只剩不到一百瓶，非常{rare|稀有}。那一年天氣很糟，葡萄很少，但釀出來的酒，卻是我父親一生最好的作品。」",
"一九六五年，正是雲棲酒店落成的那一年。許知夏摸著那張泛黃的酒{label|標籤}，心裡一陣感動。程以安當場決定買下這瓶酒：「等雲棲六十週年的時候，我們一起打開它。」她轉頭看他，發現他說的是「我們」。",
"回台灣前，程以安和酒莊簽下長期合約，由程氏集團{exclusive|獨家}{import|進口}他們的葡萄酒到亞洲。老先生很高興，他說酒莊這幾年的{export|出口}量越來越少，年輕人都不想種葡萄了，這份合約讓他重新看到希望。",
"回程的飛機上，許知夏睡著了，頭靠在程以安的肩膀上。他一動也不敢動，就這樣僵著脖子撐了十二個小時。下飛機時，祕書看著總裁一臉痠痛的樣子，忍不住問：「您沒事吧？」程以安揉著脖子，淡淡地說：「沒事，值得。」"]},
{t:"她的過去",p:[
"從法國回來後，許知夏變得有點奇怪。她常在下班後一個人坐在頂樓{daydream|發呆}，手機響了也不接。程以安注意到了，但他不擅長問別人的心事，只能每天晚上默默在頂樓的{bench|長椅}上放一杯熱可可。",
"某天晚上，他終於忍不住走上頂樓。許知夏看著他，沉默了很久，才開口：「下週，我媽媽要從美國回來了。我已經十八年沒見過她了。」",
"她慢慢說出自己的{background|身世}。她八歲那年，爸爸生意{failure|失敗}，留下一大筆債，媽媽一個人去了美國，從此再也沒有回來。她和爺爺住在萬華的一間小{apartment|公寓}裡，{childhood|童年}的記憶，大多是爺爺騎著舊{scooter|機車}送她上學的背影。",
"「那時候家裡很窮，」她笑了笑，「冬天沒有熱水，就燒一壺水分兩次洗澡。」{poverty|貧窮}沒有打倒她，她靠著{scholarship|獎學金}讀完高中和大學，畢業後一邊上班，一邊幫爺爺還債。她一直在{struggle|奮鬥}，從來沒有停下來過。",
"程以安靜靜地聽著。他原本以為，她的笑容是因為生活很順利。現在他才知道，那是一個人在吃了很多苦之後，仍然選擇溫柔的樣子。她是他見過最{resilient|堅韌}的人。",
"「我不需要{sympathy|同情}，」她擦了擦眼角，「我只是不知道，見到她的時候該說什麼。我很生氣，但又很想她。」程以安想了想，說出一個從未告訴任何人的秘密：「我父親在我十歲那年過世。他走之前，我們大{quarrel|吵了一架}。我到現在都很{regret|後悔}，沒有跟他說最後一句話。」",
"那天晚上，他們在頂樓坐到天亮，說了很多話。許知夏第一次覺得，這個冷冰冰的總裁，其實也是一個會受傷的人。天快亮時，程以安說：「不管妳決定怎麼做，我都陪妳去機場。」",
"機場的{arrival|入境}大廳，一個頭髮半白的女人推著行李走出來。她看見許知夏，整個人愣住，接著就哭了出來。女人一直說對不起，說當年她不是不想回來，說她每年都偷偷寄錢，只是全被{creditor|債主}拿走了。這些事，終於在十八年後被{reveal|揭開}。",
"許知夏站在原地很久，最後慢慢走過去，抱住了她。「我不知道能不能{forgive|原諒}妳，」她輕聲說，「但我想試試看。」她挺直了背，帶著{dignity|尊嚴}，也帶著一點點釋懷。程以安站在不遠處，悄悄別過頭去。他知道，她已經{overcome|克服}了最難的那一關。"]},
{t:"董事會的質疑",p:[
"雲棲連續三季創下營收新高，程以安決定在年度董事會上，正式{appoint|任命}許知夏為雲棲酒店總經理。消息一傳出，集團內部立刻炸開了鍋。她才二十七歲，是程氏集團{history|史上}最年輕的總經理人選。",
"二伯第一個提出{objection|異議}：「她從櫃台做起，不到兩年就要當總經理？太{inexperienced|缺乏經驗}了。」其他幾位老董事也紛紛表示{oppose|反對}。有人甚至在私下說，她升得這麼快，只是因為總裁喜歡她。",
"董事會前一週，許知夏收到一封匿名信，信裡只有一句話：「識相的話，自己退出。」她把信揉成一團丟進{trash|垃圾桶}，然後打開電腦，開始準備簡報。她知道，自己必須用數字{prove|證明}一切。",
"董事會當天，會議室裡坐滿了人。程以安介紹完人選，二伯就冷冷地說：「以安，我們{respect|尊重}你的決定，但這件事必須{vote|投票}。」他環視全場，「我相信大家都不會拿集團的未來開玩笑。」",
"許知夏站起來，打開投影片。她沒有說自己有多努力，只是一頁一頁展示：雲棲的{occupancy|入住率}、顧客{satisfaction|滿意度}、員工離職率、老街導覽帶來的營收。每一個數字都比集團平均高出許多。「我知道我很年輕，」她說，「但這些成績，都是真實而且{credible|可信}的。」",
"二伯還想反駁，程以安先開口了：「如果各位覺得我推薦她只是出於{bias|私心}，我可以{justify|說明}我的理由。」他停了一下，「但如果投票不通過，我會{resign|辭去}總裁的職位。一個不懂得看人才的集團，不需要我這個總裁。」",
"會議室裡一片譁然。許知夏轉頭看他，眼裡寫滿了不敢相信。二伯臉色鐵青：「你這是在{threaten|威脅}董事會！」程以安語氣平靜：「不，我只是讓大家知道，我有多認真。」",
"投票開始了。第一輪結果，八票贊成，四票反對。原本反對的{majority|多數}，變成了{minority|少數}。接著，連二伯身邊的兩位董事也改變了主意。主席宣布進行第二輪{ballot|表決}，結果是十一比一。",
"唯一投反對票的二伯摔門而去。散會後，許知夏在走廊上攔住程以安：「您剛才瘋了嗎？萬一沒通過怎麼辦？」他低頭看她，嘴角帶著笑：「不會的。妳的報告這麼好，就算是我，也會投贊成票。」雖然不是{unanimous|全票}通過，她知道，這已經是最好的結果。"]},
{t:"國際旅展",p:[
"成為總經理後，許知夏的第一個大任務，是帶團參加東京國際旅遊{exhibition|展覽}。這是亞洲最大的旅展，每年吸引超過二十萬名{visitor|參觀者}，也是各大飯店集團爭奪客源的{battlefield|戰場}。",
"程氏集團的{booth|攤位}位在主展館中央。許知夏把攤位設計成雲棲大廳的樣子：紅磚牆、木頭旋轉門，還有一座小型的銅鐘{replica|複製品}。只要有人敲響銅鐘，就能抽一張雲棲的{voucher|住宿券}。",
"開展前一天晚上，意外發生了。工作人員發現，攤位上準備{display|展示}的{model|模型}和宣傳品全都不見了，只剩一張紙條：「祝妳好運。」監視器拍到一個戴帽子的男人，背影像極了程以安同父異母的弟弟程以哲，二伯最疼愛的那個人。",
"許知夏沒有時間難過。她帶著團隊連夜跑遍東京的{stationery|文具}店和手工藝店，用{cardboard|紙板}、彩色筆和從飯店帶來的照片，重新做出一個手工攤位。天亮時，攤位雖然不像原本那麼精緻，卻多了一種溫暖的感覺。",
"開展第一天，人潮擠滿了展館。許知夏站在攤位前，用日文和英文向每一位參觀者介紹雲棲。她準備了一個特別的住宿{package|套裝}：三晚住宿加上老街導覽，早鳥預訂還享有七折{discount|折扣}。不到半天，預訂單就排到了下個月。",
"下午，一位來自新加坡的{agency|旅行社}老闆特地停下腳步：「在一堆大理石和水晶燈的攤位裡，你們的手工攤位最能{attract|吸引}人。」他當場簽下合作意向書，說要把雲棲排進他們明年所有的台灣行程。",
"晚上的商務{reception|酒會}，是建立人脈的重要場合。許知夏一一拜訪來自各國的{delegate|代表}，交換名片、聊合作方案。她發現，在這個{competitive|競爭激烈}的產業裡，最打動人的往往不是價格，而是真誠的故事。",
"酒會快結束時，程以哲端著酒杯走過來，皮笑肉不笑地說：「許總經理，攤位很有創意嘛。」許知夏笑容不變：「謝謝。多虧有人幫我們省下了布置費，這次的{promotion|促銷}活動，我們全部拿去做折扣了。」程以哲臉色一變，轉身就走。",
"旅展結束，雲棲拿下最佳攤位獎，海外訂房量成長了四倍。回飯店的路上，程以安在電話那頭說：「聽說妳在東京很會{network|建立人脈}，收到的名片比我一年還多。」許知夏笑出聲：「那您要不要{register|報名}當我的助理？薪水好談。」電話那頭沉默了三秒，然後傳來一聲低低的笑。"]},
{t:"海島度假村",p:[
"程氏集團買下了澎湖一座{island|小島}的開發權，打算興建亞洲最奢華的海島{resort|度假村}。董事會指定由程以哲負責這個案子，二伯在會上得意地說：「這才是真正能賺錢的生意，不是那些老房子。」",
"程以安卻把許知夏也加進了團隊。「以哲做事只看利潤，」他私下說，「我需要妳盯著他。」許知夏不太情願，但看到小島照片的那一刻，她改變了主意。那裡的{scenery|風景}美得像一幅畫：碧藍的海、白色的{beach|沙灘}，還有成群的海鳥。",
"第一次上島考察，程以哲帶著一群建築師，指著{coastline|海岸線}說：「這裡蓋一百間水上{villa|別墅}，那裡填海做私人{pier|碼頭}。」當地{fisherman|漁民}站在遠處，臉色越來越難看。一位老伯伯走過來，用台語說：「少年仔，你們要是把這裡填了，魚就沒了。」",
"許知夏請來一位{marine|海洋}{biologist|生物學家}調查。報告顯示，小島周圍有大片健康的{coral|珊瑚}礁，是許多稀有{species|物種}的{habitat|棲息地}，也是全台灣{biodiversity|生物多樣性}最豐富的海域之一。一旦填海，整個{ecosystem|生態系}都會被破壞。",
"不只如此，{coastal|沿海}的沙灘本來就有{erosion|侵蝕}的問題。學者警告，如果再蓋水上別墅、改變{tide|潮汐}的流向，十年內沙灘就會消失。到時候，度假村賣的美景也不存在了。",
"程以哲在會議上拍桌：「妳懂什麼？客人來度假，誰在乎珊瑚？」許知夏把報告推到他面前：「客人在乎的是乾淨的海。全世界最貴的度假村，賣的都是自然。如果海裡全是{pollution|污染}，誰會花五萬塊住一晚？」",
"她提出新的設計：減少一半的房間，全部蓋在陸地上，用太陽能供電，廢水全部回收處理。度假村還要和當地漁民合作，讓客人跟著漁船出海、學做海鮮料理。「我們不是來佔領這座島，」她說，「是來當客人的。」",
"程以哲當然不肯。但這一次，連二伯都猶豫了，因為環保團體已經在網路上發起{petition|連署}，反對任何破壞珊瑚礁的開發案。最後，董事會通過了許知夏的方案，程以哲被調離專案。他離開會議室時，看她的眼神冷得像冰。",
"動工那天，那位老伯伯特地帶著一籃剛捕的小卷來工地，拍拍許知夏的肩膀：「查某囡仔，你們是好人。」許知夏笑著收下，轉頭發現程以安正在一旁拍照。「拍什麼？」「拍證據，」他說，「證明我的眼光很好。」許知夏望著遠方的海，第一次覺得，保護一片海，也能是一門好生意。"]},
{t:"誤會與分手",p:[
"程以哲沒有善罷甘休。一個月後，許知夏收到一個沒有{signature|署名}的{envelope|信封}，裡面是幾張{photograph|照片}：程以安和一位穿套裝的年輕女子在餐廳裡吃飯，兩人有說有笑，還有一張是女子挽著他的手走進飯店。",
"信封裡還附了一份文件，是二伯私人祕書寫的{minutes|會議紀錄}：「以安答應，只要讓許知夏當上總經理，他就會在明年和黃氏集團的千金訂婚，換取黃家的股份支持。」許知夏讀了三遍，手指越來越冷。",
"她告訴自己不要亂想，不要{assume|以為}最壞的情況。可是照片就在眼前，紀錄上的日期也對得上。她想起董事會那天，程以安為她賭上總裁的位子。原來，那不是因為愛，而是一場交易。",
"那幾天，她刻意和程以安保持{distance|距離}。他傳訊息，她只回「收到」；他來飯店，她就躲進辦公室。程以安察覺不對勁，在走廊上攔住她：「妳最近怎麼了？」回答他的，只有長長的{silence|沉默}。",
"最後，她把照片放在他桌上。程以安看了一眼，臉色一沉：「妳相信這些？」「我只想聽你說，是不是真的。」他沉默了，因為他確實見過黃家千金，也確實談過股份的事。他的{pride|自尊}讓他說不出口，只冷冷地說：「如果妳不{trust|信任}我，我說什麼都沒用。」",
"那天晚上，許知夏交出了{resignation|辭呈}。她走出雲棲的旋轉門時，整個人{heartbroken|心碎}，卻沒有掉一滴眼淚。小葵抱著她說：「也許是誤會。」她搖搖頭：「就算是誤會，他連解釋都不願意。我不想一直當那個{insecure|沒有安全感}、患得患失的人。」",
"一週後，真相才浮出水面。原來，黃家千金是程以安大學時的學妹，那天是在幫他介紹一位願意買下二伯股份的投資人。所謂的訂婚交易，是程以哲為了逼他讓步，故意{exaggerate|誇大}又{fabricate|捏造}出來的。照片也是刻意挑{angle|角度}拍的，目的就是要{mislead|誤導}她。",
"程以安知道後，第一次在辦公室裡大發{temper|脾氣}，把程以哲叫來罵了一個小時。但他更氣的是自己。他寧願用驕傲{protect|保護}自己，也不願意說一句真心話。為了打倒二伯，他原本打算瞞著所有人，{sacrifice|犧牲}一大筆私人{property|財產}買回股份，卻忘了身邊最重要的人，也有權利知道。",
"那天深夜，他跑到許知夏的租屋處，在門外站了兩個小時。門終於打開時，他說的第一句話是：「對不起。是我太驕傲，忘了妳不是我的員工，是我最想{reconcile|和好}的人。」許知夏看著他被雨淋濕的樣子，想起颱風夜那個濕透的陌生人，終於哭了出來。"]},
{t:"飯店罷工",p:[
"許知夏回到雲棲的第二週，一場風暴悄悄逼近。集團旗下的人力{dispatch|派遣}公司由程以哲管理，他為了做出漂亮的帳面，偷偷砍了一成的{wage|工資}，又取消了好幾項員工{benefit|福利}。",
"{housekeeping|房務}部的阿姨們最先受不了。她們每天要打掃的房間從十二間增加到十八間，{workload|工作量}暴增，{overtime|加班}費卻一毛都沒有。累積已久的{grievance|不滿}，終於在一個星期一的早上爆發了。",
"清晨六點，雲棲大門口站滿了穿著制服的員工。他們拉著{banner|白布條}，上面寫著：「我們不是機器」。飯店{union|工會}宣布，如果三天內得不到回應，就要全面{strike|罷工}。消息一出，各大媒體的{camera|攝影機}全都對準了雲棲。",
"二伯在電話裡大罵：「讓保全把他們趕走！」程以安卻親自來到現場，對許知夏說：「這是妳的飯店，妳的員工。我相信妳。」許知夏點點頭，脫下高跟鞋，換上一雙球鞋，走進了{protest|抗議}的人群。",
"她沒有帶{lawyer|律師}，也沒有帶{megaphone|擴音器}，只是搬了一張椅子，坐在房務部阿姨們中間。「我在這裡做過四年夜班，」她說，「我知道大家有多累。今天我不是以總經理的身分來的，是以老同事的身分。請告訴我，你們最需要的是什麼。」",
"那天，她在門口坐了整整十個小時，聽每一個人說話。有人說孩子生病了卻請不到假，有人說腰痛到睡不著。她把每一件事都記下來，晚上又到派遣公司翻帳本，發現這場{labor|勞資}衝突的源頭，根本不是飯店沒錢，而是錢被拿去填程以哲另一個投資案的洞。",
"第三天早上，許知夏邀請工會代表、派遣公司和集團人資坐下來談。她親自{mediate|調解}，提出三個方案：恢復原本的工資和福利、每人每天最多打掃十二間房，並且全體員工{raise|加薪}百分之五。加薪的錢，從她今年的總經理{bonus|獎金}裡撥出一半。",
"工會代表愣住了：「總經理，妳為什麼要這樣做？」許知夏笑了笑：「因為飯店最值錢的不是大理石，是你們。」這場{dispute|爭議}當天下午就落幕了。員工們拆下白布條，有人哭，有人鼓掌，整間飯店的{morale|士氣}從谷底回升。",
"調查結果送到董事會後，程以哲被解除所有職務，二伯也辭去董事的位子，搬去了加拿大。那天晚上，房務部的阿姨們在員工餐廳煮了一大鍋麻油雞，硬是要許知夏和程以安一起吃。程以安被灌了三碗湯，臉紅得像蝦子，卻一直在笑。"]},
{t:"極光下的求婚",p:[
"冬天來臨前，程以安突然宣布要休一個長假，這是他當上總裁十年來的第一次。他把一張{ticket|機票}放在許知夏桌上，目的地是芬蘭北部的一個小鎮。「妳說過，這輩子最想看一次{aurora|極光}，」他說，「我們去看。」",
"這趟{journey|旅程}比想像中遙遠。他們從台北飛到赫爾辛基，再{layover|轉機}到拉普蘭，最後搭了兩個小時的雪地巴士，才抵達那間建在{forest|森林}裡的玻璃屋。下車的那一刻，零下二十度的冷空氣讓許知夏整個人清醒過來。",
"白天，他們坐著哈士奇{sled|雪橇}穿越森林，在結冰的湖上釣魚，還去拜訪了當地的{reindeer|馴鹿}牧場。對在台北長大的許知夏來說，每一件事都是一場{adventure|冒險}。程以安第一次駕雪橇就翻車，兩個人滾在雪地裡笑到停不下來。",
"可是一連三個晚上，天空都被雲層遮住，連一顆星星都看不到。{guide|導遊}說，極光是一種很難預測的自然{phenomenon|現象}，有些人來了一週都沒看到。許知夏有點失望，卻安慰程以安：「沒關係，能跟你來這裡，已經很{memorable|難忘}了。」",
"程以安卻比她還焦慮。他每隔一個小時就查一次極光預報，晚餐只吃了幾口，連說話都心不在焉。許知夏以為他工作上出了問題，完全沒注意到，他的外套口袋裡一直藏著一個小小的{velvet|絲絨}盒子。他這輩子從沒這麼{nervous|緊張}過。",
"第四天晚上，導遊忽然敲門大喊：「快出來！」他們衝到屋外，抬頭的那一刻，兩個人都說不出話來。綠色的光帶在夜空中流動，從{horizon|地平線}的一端延伸到另一端，像一條會呼吸的河。那景象太{magnificent|壯麗}，美得讓人想哭。",
"許知夏從來沒看過這麼{breathtaking|令人屏息}的景色。她轉頭想跟程以安說話，卻發現他已經{kneel|跪}在雪地上，手裡捧著那個絲絨盒子。極光的綠光映在他臉上，她只來得及{glimpse|瞥見}盒子裡閃閃發亮的東西，眼淚就模糊了視線。",
"「許知夏，」他的聲音在發抖，「颱風那天晚上，妳給了我一碗薑湯，和一間最小的房間。從那天起，我每天都在{anticipate|期待}能再見到妳。我這輩子做過無數個決定，只有這一個，我確定永遠不會後悔。妳願意嫁給我嗎？」",
"她哭著點頭，他把戒指戴在她手上，兩個人在雪地裡抱了很久。回到屋裡，導遊笑著告訴他們，今晚的極光是十年來最強的一次。許知夏看著手上的戒指，笑著說：「看來連老天都被你{astonish|嚇到}了。」程以安把她摟進懷裡：「我自己也嚇到了。」"]},
{t:"新的開始",p:[
"婚禮決定辦在雲棲。許知夏說，這間飯店是一切開始的地方，也是爺爺口中全世界最美的飯店。消息傳出後，許多老客人都打電話來，說想參加這場婚禮，親眼看那座銅鐘為新人敲響。",
"婚禮前一晚，全飯店的員工偷偷布置了大廳。房務部阿姨們摺了一千朵紙{rose|玫瑰}，老吳親手做了七層的婚禮{cake|蛋糕}，連當年的櫃台主管林姐都特地請假回來幫忙。許知夏走進大廳時，整個人愣住，久久說不出話。",
"第二天，大廳裡坐滿了賓客，其中有兩位特別的客人：陸氏集團董事長陸景川，和他的妻子林語晴。原來程以安和陸景川是多年的商場好友，這次特地從新加坡飛回來。林語晴握著許知夏的手說：「歡迎加入總裁夫人{club|俱樂部}。」",
"典禮開始，銅鐘響了三聲。許知夏的媽媽牽著她的手，慢慢走向程以安。母女倆曾經十八年沒見，如今重新走在一起，台下許多人都紅了眼眶。媽媽把女兒的手交給程以安時，只說了一句：「請你好好{cherish|珍惜}她。」",
"交換{vow|誓言}時，程以安拿出一張摺得{wrinkled|皺皺}的紙：「我向來不太會說話，所以昨天晚上寫了十幾遍。」他清了清喉嚨，「許知夏，我承諾一輩子{devote|奉獻}自己，給妳一個溫暖的家。我會學著說真心話，不再用驕傲把妳推開。」",
"許知夏的誓言很短：「程以安，謝謝你讓我知道，一個人的{origin|出身}決定不了他的{destiny|命運}。從今以後，我願意當你一生的{companion|伴侶}，陪你看每一場颱風，也陪你看每一次極光。」台下響起熱烈的掌聲，許多人一邊拍手一邊擦眼淚。",
"晚宴上，賓客們輪流上台{toast|敬酒}。房務部的阿姨唱了一首台語老歌，林姐說了許知夏當年在夜班{embarrass|出糗}的故事，逗得全場哈哈大笑。程以安也難得放鬆，摟著{bride|新娘}在大廳中央跳了第一支舞。整個晚上，雲棲充滿了笑聲與{harmony|和諧}。",
"夜深了，程以安和許知夏一起打開那瓶一九六五年的波爾多{wine|紅酒}。酒香在空氣中散開，他們舉起杯子，敬雲棲、敬爺爺，也敬所有給過他們{blessing|祝福}的人。許知夏輕輕{embrace|擁抱}了媽媽，又抱了抱一直在旁邊偷哭的小葵。",
"隔天一早，他們出發去度{honeymoon|蜜月}。臨走前，許知夏站在旋轉門前，回頭看了一眼大廳。銅鐘還在，紅磚牆還在，她和他的故事，也才剛剛開始。她挽著程以安的手說：「我們每年都要回來{celebrate|慶祝}結婚紀念日。」他點點頭：「當然。這是我這輩子最{unforgettable|難忘}的地方。」"]},
{t:"急診室的相遇",p:[
"凌晨兩點，台北一家醫學中心的急診室燈火通明。第二年{resident|住院醫師}江念已經連續值班二十個小時，眼睛乾得像砂紙。她剛喝了一口冷掉的咖啡，{broadcast|廣播}就響了：「一號急救室，車禍{casualty|傷患}，{ambulance|救護車}五分鐘後到。」",
"推進來的男人穿著被{blood|血}染紅的白襯衫，在車禍現場一度{unconscious|失去意識}，在救護車上才勉強醒過來。江念迅速檢查他的{pupil|瞳孔}和呼吸，同時大聲交代護理師：「接上心電圖，{monitor|監測}血壓和血氧！」",
"檢查結果出來，男人的{vital|生命}徵象還算穩定，但左手臂有明顯的{fracture|骨折}，{rib|肋骨}也裂了兩根。江念很快{diagnose|診斷}出他還有輕微的內出血，必須立刻通知骨科的{surgeon|外科醫師}。「情況可能會變得{critical|危急}，」她說，「準備手術。」",
"男人卻抓住她的手，聲音虛弱但很堅定：「不行，我十點要開董事會。先給我{painkiller|止痛藥}，我晚點再來。」江念愣住了，這是她當醫生以來，聽過最{absurd|荒謬}的一句話。「先生，你的肋骨斷了。董事會可以改期，你的命不能。」",
"「我不簽同意書。」男人別過頭，「沒有我的{consent|同意}，你們不能幫我{operate|動手術}。」江念深吸一口氣，把病歷板放下，俯身看著他的眼睛：「好。那我告訴你，如果現在不處理，你可能撐不到十點。你確定要讓你的董事會，改開你的追悼會嗎？」",
"男人看著她，沉默了很久。最後，他接過筆，在同意書上簽下自己的名字：顧承遠。護理師在旁邊倒抽一口氣，小聲說：「江醫師，他是遠航科技的總裁……」江念頭也不抬：「在我的急診室裡，他只是十二號床的病人。」",
"手術很成功。顧承遠被轉進{intensive|加護}病房觀察一晚。隔天早上江念來巡房時，他已經在用沒受傷的右手打電腦了。她一把抽走他的筆電：「你的{treatment|治療}還沒結束。這一週，不准工作。」",
"「妳知道我一小時值多少錢嗎？」「知道，」江念把筆電鎖進護理站的櫃子，「但你知道我一小時要救幾個人嗎？我沒空每天來搶你的電腦。」隔壁床的阿伯笑得太用力，差點把點滴扯掉。",
"出院那天，顧承遠的助理送來一束花和一張卡片，卡片上只寫了一句話：「江醫師，謝謝妳沒讓我的董事會變成追悼會。」江念看完就把卡片丟進抽屜，花則轉送給了護理站。她以為，這只是她無數個病人中的一個。她沒想到，一個月後，他會帶著一份合約，重新出現在她面前。"]},
{t:"人工智慧醫生",p:[
"一個月後，顧承遠出現在醫院的會議室裡，身後跟著一群工程師。{director|院長}滿臉笑容地介紹：「遠航科技將和我們合作，開發一套{artificial|人工}{intelligence|智慧}急診判讀系統。顧總點名，要江醫師擔任{clinical|臨床}顧問。」",
"江念差點把咖啡噴出來。會後，她在走廊上攔住他：「為什麼是我？」顧承遠的手臂還吊著三角巾，語氣卻很理所當然：「因為妳是唯一敢搶我電腦的醫生。我需要一個不會對我說好聽話的人。」",
"遠航的工程師解釋，他們開發的{algorithm|演算法}可以在幾秒內{analyze|分析}病人的X光片和抽血報告，從上百萬筆的{database|資料庫}中找出最相近的{case|病例}，{predict|預測}病情惡化的機率。「在我們的測試中，」首席工程師驕傲地說，「它比人類醫師還要{accurate|準確}。」",
"「然後呢？」江念問，「你們要用它{replace|取代}醫生嗎？」會議室裡安靜了下來。顧承遠看著她：「妳覺得不行？」「我覺得很危險，」她說，「機器可以算出機率，但它不會知道，那個說自己只是{stomachache|胃痛}的老伯，其實是怕花錢才不敢說胸口痛。」",
"為了證明自己的看法，江念帶著顧承遠在急診室待了一整夜。他看著她安撫一個哭到喘不過氣的小女孩、說服一位堅持要回家的獨居老人留院觀察，又在病人家屬{collapse|崩潰}時默默遞上面紙。天亮時，他第一次承認：「有些事，確實不是{technology|科技}能做到的。」",
"但江念也看到了系統的價值。急診室裡最可怕的不是忙，而是累，累到人會犯錯。上個月，一位學長連續值班三十個小時，看漏了一張X光片上的小骨折。「如果系統能幫我們抓出這種{error|錯誤}，」她說，「那它就不是對手，是隊友。」",
"他們終於達成{consensus|共識}：系統只負責提醒，最後的判斷一定由醫生來做。顧承遠還答應她，系統會把醫生最花時間的{paperwork|文書}工作{automate|自動化}，讓醫生把時間還給病人。「科技應該讓人更像人，」江念說，「而不是讓人變成機器。」",
"合作的第一個月，系統幫急診室抓出了七個差點被忽略的危急病例。江念也堅持，所有病人資料都必須匿名處理，並經過倫理{committee|委員會}審查。「我們必須確保這套系統是{ethical|合乎倫理}的，」她說，「病人信任我們，才會把身體交給我們。」",
"某天晚上，江念在值班室收到一則訊息，是顧承遠傳來的：「今天的系統報告顯示，江醫師已連續工作二十二小時，強烈建議休息。」她瞪著手機回了一句：「總裁，您是用公司的系統在監視我嗎？」他秒回：「不是監視，是關心。系統預測，妳再不睡覺，明天會變成殭屍。」"]},
{t:"實驗室的夜晚",p:[
"系統上線半年後，江念發現了一個奇怪的現象。急診室裡被系統標記為高風險的{heart disease|心臟病}患者，很多人都有一個共同點：他們的智慧手錶紀錄顯示，發病前一週的睡眠時間都異常地短。她提出一個{hypothesis|假說}：睡眠模式的改變，也許能提早預測心臟病發作。",
"顧承遠聽完，眼睛一亮：「那我們就來證明它。」他把遠航科技頂樓的一層改建成{laboratory|實驗室}，邀請江念和醫院的心臟科團隊一起做{research|研究}。江念白天看診，晚上就到實驗室分析資料，常常待到凌晨。",
"他們設計了一個大型{experiment|實驗}，招募五千名自願者，請他們戴著特製的{wristband|手環}，記錄三個月的睡眠和心跳。每一位自願者還要定期抽血，提供血液{sample|樣本}。整個團隊忙得昏天暗地，連過年都在實驗室裡吃泡麵。",
"研究最困難的地方，是控制每一個{variable|變數}。年齡、{gender|性別}、工作壓力、喝不喝咖啡，都可能影響結果。江念每天晚上對著幾萬筆數據發呆，有時候算到一半，才發現前面的{formula|公式}寫錯了，只能全部重來。",
"某天凌晨三點，實驗室裡只剩他們兩個人。江念趴在桌上睡著了，醒來時發現身上多了一件西裝外套，桌上放著一杯熱豆漿和一個飯糰。顧承遠坐在對面，正一行一行檢查她寫的{program|程式}。「妳的第四十二行有錯，」他頭也不抬，「我幫妳改了。」",
"江念盯著他，忽然問：「你一個總裁，為什麼要陪我熬夜做研究？」顧承遠停下手，沉默了一會兒：「我母親是心臟病過世的。那天她說胸口悶，以為只是太累，睡一覺就好，結果再也沒醒過來。」他推了推眼鏡，「如果那時候有人能提早發現，也許結果會不一樣。」",
"三個月後，數據分析終於完成。結果顯示，睡眠模式的改變和心臟病發作之間，確實有{statistics|統計}上{significant|顯著}的關聯。為了{verify|驗證}結果，他們又請另一間醫院的團隊用不同的資料重算一次，結論完全一致。",
"江念把研究寫成論文，{submit|投稿}到國際頂尖的醫學{journal|期刊}。審查過程非常嚴格，評審提出了三十幾個問題，她一個一個回答，改了五個版本。半年後，論文終於獲准{publish|刊登}，還成為那一期的{cover|封面}文章。",
"論文的{conclusion|結論}只有短短一行：「穿戴式裝置的睡眠資料，可以作為心臟病的早期警訊。」但這一行字背後，是無數個不眠的夜晚。慶功宴上，有記者問顧承遠，這項研究最重要的{theory|理論}基礎是什麼。他指了指身邊的江念：「理論是她的，我只負責買宵夜。」"]},
{t:"隱私風暴",p:[
"論文發表後一個月，遠航科技遭遇了成立以來最大的危機。一群{hacker|駭客}入侵公司的{server|伺服器}，偷走了合作醫院數萬名病人的健康資料，還在網路上公開了一部分。新聞{headline|標題}寫著：「科技巨頭重大資料外洩，你的{record|病歷}可能已經曝光。」",
"這起{breach|外洩}事件引發社會一片譁然。民眾憤怒地質問，為什麼一間科技公司能拿到這麼多醫療資料？立法院召開{hearing|公聽會}，要求遠航說明。有{legislator|立委}甚至說，遠航根本是在做{surveillance|監控}，把病人當成實驗品。",
"江念也被捲了進去。醫院的同事開始用懷疑的眼光看她，有人在背後說，她是為了發論文，才把病人的資料交給科技公司。她回到家，發現信箱裡塞滿了陌生人的謾罵，連她的{identity|身分}資料都被人貼到網路上。",
"顧承遠第一時間召開記者會，向社會公開道歉。他宣布成立調查小組，並承諾負擔所有受影響病人的損失。記者會結束後，他直接開車到江念家樓下，一夜沒有離開，因為他擔心有人會找上門。",
"調查結果很快就出來了。駭客之所以能入侵，是因為一位{outsource|外包}工程師把伺服器的{password|密碼}寫在便利貼上，貼在螢幕旁邊，被人拍照傳上網路。駭客利用這組密碼，取得了{unauthorized|未經授權}的系統{access|權限}。",
"更讓人憤怒的是，那些被偷的資料雖然經過匿名處理，卻沒有完整{encrypt|加密}，這是外包公司為了節省成本偷偷跳過的步驟。顧承遠看著報告，臉色鐵青：「我們說要保護病人的{privacy|隱私}，結果卻敗在一張便利貼上。」",
"他做了一個讓所有人意外的決定：暫停系統三個月，全面升級資安。他請來國際頂尖的資安{expert|專家}，重新設計整套{security|安全}架構，所有資料一律加密，連公司內部的工程師都無法直接讀取病人的原始資料。",
"江念則站上公聽會的發言台。她沒有替遠航辯護，而是誠實說明這套系統救了多少人，也指出現有{legislation|法規}的{loophole|漏洞}。「醫療科技需要資料，」她說，「但病人需要的是保障。我們該做的不是因噎廢食，而是建立更好的制度，來{safeguard|保護}每一個人。」",
"三個月後，政府通過了新的醫療資料保護法，遠航成為第一家通過新標準的公司。系統重新上線那天，江念收到一張卡片，是一位被系統救回一命的病人寫的：「謝謝你們沒有放棄。」她把卡片拿給顧承遠看。他看了很久，輕聲說：「這是我收過最好的成績單。」"]},
{t:"遠端看診",p:[
"江念在台東的山上長大，這是她很少跟別人提起的事。她的家鄉是一個只有三百人的{rural|偏鄉}{tribe|部落}，最近的醫院開車要兩個小時。小時候，她親眼看過阿嬤半夜{fever|發燒}，卻因為下大雨、山路{landslide|坍方}，等到天亮才被送下山。",
"有一年過年，她帶顧承遠回部落。村子裡唯一的{clinic|診所}一週只開兩天，醫師是從市區輪流上山的。{shortage|短缺}的不只是醫生，連護理師和{pharmacist|藥師}都找不到人。顧承遠看著診所門口排隊的長長人龍，久久說不出話。",
"排隊的大多是{elderly|年長}的老人家，很多人都有高血壓、{diabetes|糖尿病}這類{chronic|慢性}病，需要長期追蹤。年輕人都去城市工作了，老人家要下山看病，常常得一大早出門，轉兩班公車，看完醫生已經是下午。",
"「如果醫生不能每天上山，」顧承遠說，「那就讓醫生每天『進到』山裡。」他們決定在部落試辦遠距醫療：老人家只要到村裡的活動中心，就能透過視訊和市區醫院的{physician|醫師}進行{consultation|看診}，系統還能即時上傳血壓和血糖數據。",
"計畫一開始就遇到很多困難。老人家不會用{tablet|平板電腦}，看到螢幕裡的醫生就緊張得說不出話。網路訊號時好時壞，看診到一半常常斷線。江念乾脆每個週末都回部落，一個一個教阿公阿嬤怎麼按按鈕、怎麼對著鏡頭說話。",
"拿藥是另一個問題。村子裡沒有{pharmacy|藥局}，老人家領{medication|藥物}還是要下山。顧承遠想了一個辦法：和物流公司合作，醫師開完處方，藥就會在兩天內用{drone|無人機}和機車接力送上山，直接送到每一戶人家門口。",
"最難的是費用。遠距醫療的設備和網路都很貴，如果要老人家自己付錢，根本沒有人負擔得起。江念跑遍了衛福部和健保署，終於爭取到遠距看診納入健保給付。顧承遠則讓遠航免費提供設備，把費用降到老人家{affordable|負擔得起}的程度。",
"一年後，部落裡老人家跑醫院的次數減少了一半，因為很多小問題在變嚴重之前就被發現了。江念說，這才是醫療最重要的事：{prevention|預防}，而不是等到病倒才治療。連部落{chief|頭目}都說，現在老人家最喜歡的活動，就是每週去活動中心「跟電視裡的醫生聊天」。",
"離開部落那天，江念的阿嬤拉著顧承遠的手，用族語說了一大串話。江念翻譯：「阿嬤說你是好人，要你好好照顧我。還說，如果你欺負我，她會拿獵刀下山。」顧承遠認真地點頭：「請轉告阿嬤，我已經幫自己買好{insurance|保險}了。」江念笑到彎下腰。"]},
{t:"投資人之夜",p:[
"遠距醫療計畫成功後，遠航科技決定成立新{department|部門}，專門開發醫療AI。但這需要龐大的{funding|資金}。顧承遠決定在年底舉辦一場投資人之夜，邀請亞洲最重要的創投和{fund|基金}經理人參加，並請江念上台介紹研究成果。",
"「我只是醫生，不懂做生意。」江念拚命拒絕。「妳不需要懂生意，」顧承遠說，「妳只要說妳最懂的事：病人。」他陪她練習了整整兩週，從投影片的{font|字體}大小，到上台時要先看哪一位{investor|投資人}，都一一提醒。",
"投資人之夜辦在信義區的一間私人俱樂部。現場坐滿了穿西裝的人，每個人手上都拿著平板，表情像在打量一件{merchandise|商品}。主持人介紹完，江念走上台，手心全是{sweat|汗}。她看了一眼台下的顧承遠，他對她比了一個「放輕鬆」的手勢。",
"她的{pitch|提案簡報}只有十分鐘。她沒有講一堆數字，而是說了一個故事：部落裡一位八十歲的阿嬤，透過視訊看診及早發現了心臟問題，現在每天還能下田種小米。「醫療AI不只是一門{lucrative|賺錢}的生意，」她說，「它是讓每一個人都能好好活下去的機會。」",
"台下安靜了幾秒，接著響起熱烈的掌聲。一位白髮的基金經理人舉手：「江醫師，妳說得很好。但我想知道，這個新部門的{valuation|估值}是多少？未來三年要怎麼{scale|擴大規模}？」江念愣了一下，顧承遠已經走上台接過麥克風，從容地回答每一個問題。",
"{intermission|中場}休息時，一位年輕的創投經理走過來，遞上名片：「江醫師，我們基金專門投資{emerging|新興}的醫療科技{sector|產業}，對你們非常有興趣。」他頓了頓，壓低聲音，「不過，我們希望在新公司拿到三成的{equity|股權}，而且要有一席董事。」",
"顧承遠在旁邊聽到了，臉色微微一沉。會後他告訴江念，那個基金的老闆是他父親的老朋友，真正的目的，是想把遠航的新部門併進顧氏集團。「我父親一直想讓我回去{succession|接班}，」他說，「他會用盡一切辦法，把我手上的{stake|股份}拿回去。」",
"最後，他選擇了另一家條件比較差、但承諾不干涉經營的基金。那家基金的{portfolio|投資組合}裡大多是長期的社會企業，不要求短期的{dividend|股利}。財務長抱怨少拿了好幾億，顧承遠卻說：「錢可以再賺，但方向一旦錯了，就回不來了。」",
"那天晚上，江念在俱樂部的陽台上找到他。他手裡拿著一杯沒喝的{whiskey|威士忌}，望著遠方的101大樓發呆。她走過去，把一杯熱茶塞進他手裡：「總裁，你今天表現得很好。」他轉頭看她，笑了：「這句話，應該是我說才對。」"]},
{t:"青梅竹馬的醫師",p:[
"新年過後，醫院來了一位新的心臟外科主治醫師：溫子言。他是江念的高中學長，也是她大學時期{crush|暗戀}過的人。溫子言在美國頂尖醫院工作了八年，這次回台灣，一報到就成了全院護理師討論的焦點。",
"溫子言長得{refined|斯文}，說話總是輕聲細語，對病人非常{gentle|溫柔}。他記得每一位病人的名字，也記得每一位護理師喜歡喝什麼{beverage|飲料}。護理站裡流傳著一句話：「溫醫師是全台灣最{charming|迷人}的醫生。」",
"「小念，好久不見。」溫子言第一次在走廊遇到江念，就笑著叫出她高中時的{nickname|綽號}。他說，他在美國讀過她發表在期刊上的{thesis|論文}，非常{admire|欽佩}她的研究。江念有點不好意思，臉一下子就紅了。",
"這一幕，剛好被來醫院開會的顧承遠看見了。他站在電梯口，看著兩個人有說有笑，手裡的文件夾差點被捏扁。助理阿傑小聲說：「總裁，您的臉色很難看。」顧承遠冷冷地回：「我只是在想，這間醫院的走廊為什麼這麼窄。」",
"從那天起，顧承遠來醫院的次數突然變多了，有時候是送宵夜，有時候是「剛好路過」。他甚至開始和溫子言{compete|較勁}：溫子言帶了咖啡給護理站，隔天顧承遠就送來一整台{espresso|義式}咖啡機。全院都看得出來，這位總裁的{possessive|佔有慾}有多強。",
"有一次，三個人在醫院{cafeteria|餐廳}碰面，氣氛{awkward|尷尬}得讓人想逃。溫子言很{polite|有禮貌}地請顧承遠坐下，還稱讚遠航的系統做得很好。顧承遠被誇得{flatter|受寵若驚}，渾身不自在，只好低頭吃飯，連湯都喝得特別大聲。",
"江念被他們搞得無法專心，查房時一直走神。她終於受不了，把顧承遠拉到{staircase|樓梯間}：「你可不可以不要再{distract|讓我分心}了？我在上班！」顧承遠看著她，難得露出委屈的表情：「我只是怕，妳會覺得他比我好。」",
"江念愣住了，接著忍不住笑出來：「顧承遠，你今年幾歲？」她{tease|取笑}他，「一個上市公司的總裁，居然在跟一個醫生吃醋？」他別過頭，耳朵紅得像要燒起來。她收起笑容，認真地說：「學長很好，但那是十年前的事了。我現在喜歡的，是一個會在急診室跟我吵架的笨蛋。」",
"後來，溫子言在一次聚餐中給了顧承遠一個{hint|暗示}：「你再不快點，小念就要被別人追走了。」顧承遠愣了一下，才發現溫子言早就結婚了，太太和孩子下個月就會從美國搬來台灣。他鬆了一口氣，終於像個{mature|成熟}的大人一樣舉起杯子：「溫醫師，以後請多指教。」"]},
{t:"疫情爆發",p:[
"那年冬天，一種新型{respiratory|呼吸道}{virus|病毒}在亞洲各地出現。一開始只是零星病例，短短一個月，就演變成一場全球{pandemic|大流行}。台北的醫院一夕之間被擠爆，急診室外搭起了白色的{tent|帳篷}。",
"這種病毒的{contagious|傳染}力極強，可以透過{droplet|飛沫}和接觸{transmit|傳播}，{spread|擴散}的速度遠遠超出所有人的預期。政府宣布，所有確診者和密切接觸者都必須居家{quarantine|隔離}十四天。街上空無一人，整座城市安靜得像一座空城。",
"江念被調到專責病房，每天穿著密不透風的{protective|防護衣}工作十二個小時。防護衣裡又悶又熱，汗水把衣服都濕透了，臉上被口罩壓出深深的痕跡。病床不夠，醫護人員不夠，連防護衣都快用完了，整個醫療系統幾乎被{overwhelm|壓垮}。",
"最讓人害怕的是，病毒對老人家的{mortality|死亡率}特別高。江念看著一位位長者被推進加護病房，有些人再也沒有出來。她不能哭，因為還有下一位病人在等。每天下班，她都要在醫院門口站一會兒，才有力氣走回家。",
"顧承遠想去醫院看她，卻被她嚴厲拒絕：「我在第一線，隨時可能被{infection|感染}，你不准來。」他只好每天打視訊電話，看著螢幕裡她越來越{haggard|憔悴}的臉，心疼得說不出話。掛掉電話後，他對著電腦，一坐就是一整夜。",
"一週後，遠航推出了一套免費的疫情追蹤系統。民眾只要掃描QR碼，就能知道自己是否接觸過確診者；醫院也能即時掌握每一張病床的使用狀況，把病人{divert|分流}到還有空位的醫院。系統上線第一天，就有三百萬人使用。",
"顧承遠還把公司的物流倉庫改成防疫物資轉運站，每天把口罩、防護衣和消毒用品送到各大醫院。每一個箱子上都貼著一張小紙條：「請記得用{alcohol|酒精}{sanitize|消毒}雙手。也請記得，你們不是一個人在戰鬥。」",
"疫情延燒了半年，科學家終於研發出{vaccine|疫苗}。江念是醫院第一批接種的醫護人員，打完針後，她拍了一張照片傳給顧承遠：「我現在有一點{immune|免疫}力了，可以見你了。」他回了一個字：「等。」二十分鐘後，他已經站在醫院門口，手裡抱著一大束{sunflower|向日葵}。",
"那是他們半年來第一次見面。江念摘下口罩，臉上還留著深深的壓痕。顧承遠什麼都沒說，只是緊緊抱住她，抱了很久很久。路過的護理師們紛紛拍手起鬨。江念把臉埋在他的胸口，第一次在疫情期間哭了出來。"]},
{t:"失去的記憶",p:[
"疫情結束後不久，顧承遠在一次出差途中出了{accident|意外}。他搭的{taxi|計程車}在高速公路上被一輛失控的貨車{collision|追撞}，頭部受到撞擊，被緊急送進江念工作的醫院。江念趕到急診室時，看見他躺在病床上，額頭纏著{bandage|繃帶}，雙腿一軟差點跪下。",
"手術很成功，可是顧承遠醒來後，看著江念的眼神，卻像在看一個{stranger|陌生人}。他完全{recognize|認}不出她。「請問，妳是哪一科的醫生？」他禮貌地問。江念整個人僵住了。醫師診斷，他的腦部受到撞擊，失去了最近兩年的{memory|記憶}。",
"他記得自己是遠航科技的總裁，記得公司的每一個專案，卻完全不記得江念。不記得急診室的那一晚，不記得實驗室的宵夜，也不記得疫情期間那束向日葵。江念坐在病床邊，聽他用最客氣的語氣說「謝謝醫生」，心像被撕成了碎片。",
"醫生說，這種失憶有可能慢慢恢復，也可能永遠不會恢復。熟悉的地方、聲音或{scent|氣味}，有時能{trigger|喚起}一些片段。江念決定，不管要花多少時間，她都要幫他找回那些記憶。",
"她帶他回到急診室，指著一號急救室說：「你在這裡，拒絕簽手術同意書。」顧承遠皺著眉頭看了很久，眼神裡充滿{confusion|困惑}：「我真的這麼不講理？」江念笑著點頭，眼淚卻掉了下來。",
"她又帶他去遠航頂樓的實驗室，泡了一杯熱豆漿放在他面前。顧承遠喝了一口，忽然停住了。「這個味道……好像很{familiar|熟悉}。」他閉上眼睛，腦海裡閃過一些{fragment|片段}：凌晨的燈光、一件西裝外套、一個趴在桌上睡著的女孩。可是那些畫面太{vague|模糊}，他怎麼都看不清楚她的臉。",
"一個月過去了，他的記憶還是沒有回來。但江念發現，他開始用和以前一樣的眼神看她。有一天，他忽然說：「江醫師，我雖然{recall|想}不起我們以前的事，但每次妳離開病房，我都覺得心裡空空的。這種感覺，是不是代表什麼？」",
"出院那天，助理阿傑交給他一個紙箱，說是從辦公室整理出來的{belongings|私人物品}。箱子最底層有一本黑色筆記本。顧承遠翻開，發現裡面全是自己的{handwriting|字跡}，記錄著兩年來和江念的每一件小事：她喜歡的豆漿要無糖，她值班超過二十小時會變得很兇，她笑起來右邊有一個小{dimple|酒窩}。",
"最後一頁寫著：「下個月，在台東的部落向她求婚。」他盯著那行字，腦海裡一陣劇痛，無數畫面像潮水一樣湧了回來。再睜開眼睛時，江念正站在門口。他看著她，聲音沙啞：「念念，妳的豆漿，是不是要無糖？」江念捂住嘴，哭著衝進他懷裡。失去的記憶終於全部{retrieve|找回}，那份{nostalgic|懷念}的感覺，在他心裡{linger|縈繞}了很久很久。"]},
{t:"火星計畫",p:[
"顧承遠恢復記憶後，遠航科技接到一個意想不到的邀請：國際太空{organization|組織}正在籌備一項載人火星{mission|任務}，希望遠航提供一套AI健康監測系統，在長達三年的旅程中，即時追蹤每一位{astronaut|太空人}的身體狀況。",
"這是遠航成立以來最大的挑戰。在太空中，沒有醫院，也沒有醫生。{spacecraft|太空船}裡的一切{resource|資源}都很有限，連{oxygen|氧氣}和水都要循環使用。一旦有人生病，系統必須在第一時間判斷問題，並告訴其他太空人該怎麼處理。",
"江念被邀請擔任醫療顧問。她第一次去太空中心參觀時，興奮得像個孩子。她在{simulation|模擬}艙裡體驗{weightless|失重}的感覺，在控制室看著巨大的螢幕上，一顆顆{satellite|衛星}沿著{orbit|軌道}繞著地球轉。「我小時候的夢想是當太空人，」她小聲對顧承遠說，「後來發現我會{carsick|暈車}。」",
"研究團隊發現，長時間處在低{gravity|重力}的環境裡，人的{bone|骨頭}會變得脆弱，{muscle|肌肉}會萎縮，心臟功能也會改變。江念之前的睡眠和心臟研究，剛好派上了用場。她和太空醫學團隊一起，設計出一套專為太空人打造的健康監測模型。",
"有一天晚上，他們在太空中心加班到很晚。顧承遠帶她到頂樓的觀測台，那裡有一台巨大的{telescope|望遠鏡}。他調好角度，讓她看。鏡頭裡是一顆紅色的{planet|行星}，安靜地掛在夜空中。「那就是火星，」他說，「我們的系統，將來會陪著那些太空人到那裡。」",
"江念看著那顆紅色的星星，久久說不出話。火星的{atmosphere|大氣}非常稀薄，地表冷得像冰，可是人類還是想去，因為好奇，也因為勇敢。「你知道嗎？」她說，「站在這裡看星星，會覺得自己好小。我們的煩惱，在{universe|宇宙}面前根本不算什麼。」",
"顧承遠轉動鏡頭，畫面換成了一片星空。「這是仙女座{galaxy|星系}，距離我們兩百五十萬光年。」他頓了頓，「我們現在看到的光，是兩百五十萬年前發出來的。等它傳到這裡，地球上已經有了人類，有了城市，也有了我們。」",
"「所以，」江念笑著問，「你想說什麼？」顧承遠沒有回答，只是從口袋裡拿出一顆小小的{meteorite|隕石}，放在她手心。「這是從火星掉到地球上的隕石，」他說，「我買了很久，一直不知道該怎麼送給妳。」他看著她的眼睛，「我只是想說，不管要走多遠，我都想跟妳一起去。」",
"一年後，火星任務的太空船成功發射。控制中心裡，所有人都屏住呼吸，看著螢幕上的火箭衝破雲層。江念握著顧承遠的手，眼淚在眼眶裡打轉，另一隻手還緊緊握著那顆火星隕石。三年後，那些太空人會抵達另一顆星球，而她和他，也會繼續寫屬於他們的故事。"]},
{t:"教育平權",p:[
"火星任務發射後，遠航接到一封特別的合作邀請，寄件人是陸氏集團的林語晴。她的英文學習App已經走進東南亞七個國家，但她發現，偏鄉的孩子就算有了App，還是有很多人連基本的{literacy|讀寫能力}都沒有，根本看不懂螢幕上的字。",
"「我們需要AI老師，」林語晴在視訊會議裡說，「一個能聽懂孩子{accent|口音}、能根據每個孩子的程度調整進度的老師。」顧承遠和江念對看了一眼，同時點頭。他們都在偏鄉長大，太清楚教育{inequality|不平等}有多殘酷。",
"他們先到台東、屏東和花蓮的偏鄉學校做調查。有些學校全校只有二十個學生，一個老師要教三個{grade|年級}。很多孩子放學後要幫忙家裡工作，晚上沒時間寫{homework|功課}。雖然國中以前都是{compulsory|義務}教育，但每年還是有不少孩子在國中畢業後就不再升學。",
"最讓江念心痛的，是一個叫小雨的女孩。她的{academic|學業}成績在全校數一數二，夢想是當醫生，卻因為家裡付不起高中的{tuition|學費}和住宿費，打算畢業後就去{factory|工廠}上班。「讀書很好，」小雨說，「可是我更想讓阿嬤吃飽。」",
"江念當場決定，用自己的研究獎金成立一個基金，資助偏鄉學生升學。顧承遠也加碼，承諾每年資助一百位學生，直到他們大學{graduate|畢業}為止。他說：「小時候，也有一個老師這樣幫過我。我只是把那份幫助，還給下一個孩子。」",
"新的AI學習系統，由林語晴的團隊設計{curriculum|課程}，遠航負責技術，江念的醫院則提供健康教育的內容。系統會根據每個孩子的答題狀況{assess|評估}程度，再調整題目{difficulty|難度}。程度好的孩子可以學得更快，跟不上的孩子也不會被丟下。",
"為了測試系統，他們在十所學校試辦了一個{semester|學期}。一開始，孩子們對著平板很{shy|害羞}，後來卻搶著要跟「AI老師」說話。有個小男孩甚至問AI老師：「你可以教我追女生嗎？」工程師們笑到不行，連夜幫系統加了一句回答：「先把英文學好再說。」",
"學期結束時，試辦學校的閱讀測驗成績平均進步了三成，{enroll|報名}升學的學生人數也增加了一倍。教育{minister|部長}特地到台東參觀，還邀請江念到大學發表一場{lecture|演講}，主題是「科技如何縮短城鄉{gap|差距}」。",
"演講的最後，江念說：「學習需要{discipline|自律}，但更需要機會。我們能做的，就是讓每一個孩子都有機會。」台下第一排坐著小雨，她剛拿到高中的入學通知，眼睛亮亮的。演講結束後，她跑上台抱住江念：「江醫師，我以後也要當醫生，像妳一樣。」"]},
{t:"父親的公司",p:[
"顧承遠的父親顧董，是顧氏集團的董事長。顧氏是台灣最大的傳統產業集團之一，旗下有{cement|水泥}、{steel|鋼鐵}和{shipbuilding|造船}公司，{dominate|主宰}了台灣大半個工業市場。顧承遠是顧家唯一的兒子，也是顧氏集團唯一的{heir|繼承人}。",
"可是十年前，他拒絕接班，一個人跑出去創辦了遠航科技。父子倆大吵一架，從此幾乎不說話。顧董一直{resent|不滿}兒子當年的決定，覺得他是故意要讓自己丟臉。顧承遠則從小就覺得，父親的愛是一種沉重的{burden|負擔}。",
"這年秋天，顧董突然{stroke|中風}住院。雖然搶救及時，但醫生說他不能再承受工作的{pressure|壓力}。董事會要求顧承遠立刻回來接班，否則就要讓外人接手家族企業。媒體每天都在猜，這位科技總裁會不會「回家」。",
"顧承遠到醫院探望父親。病床上的顧董瘦了很多，眼神卻還是一樣{stern|嚴厲}。「你終於肯回來了，」他說，「我以為你這輩子都要{rebel|反抗}到底。」顧承遠沉默了很久：「爸，我不是想反抗您。我只是不想活成您想要的樣子。」",
"顧董冷笑：「我想要的樣子？我只是希望你像個顧家人一樣，{obey|聽從}{elder|長輩}的安排。」他閉上眼睛，「你從小到大，從來沒有讓我滿意過。你知道我有多{disappoint|失望}嗎？」顧承遠握緊拳頭，轉身離開了病房。",
"那天晚上，江念在醫院走廊上，遇到了正在散步的顧董。顧董打量她：「妳就是那個讓我兒子不肯回家的醫生？」江念笑了笑：「顧董，他不肯回家，不是因為我。是因為他一直在等您說一句話。」",
"「什麼話？」江念沒有回答，只是陪他走到病房門口，從包包裡拿出一份{clipping|剪報}。那是十年前遠航剛成立時的新聞，已經泛黃，邊緣被摸得起了毛，上面有人用紅筆畫了好幾條線。「這是護理師整理病房時，在您的抽屜裡找到的，」她說，「您其實一直都在看他，對不對？」",
"顧董看著那份剪報，久久說不出話。第二天早上，他把顧承遠叫到病床前。「顧氏的事，我會讓{professional|專業}經理人接手，」他說，「你繼續做你的遠航。」顧承遠愣住了。顧董別過頭，聲音很小：「我不得不{acknowledge|承認}，你做得比我好。這件事，我早就知道了。」",
"走出病房時，顧承遠紅著眼眶。江念握住他的手，沒有說話。父子之間的{reconciliation|和解}，或許是{inevitable|必然}的，只是來得太晚。那天晚上，他在父親床邊坐到天亮，聊了十年來沒聊過的話。臨走前，顧董說：「那個醫生不錯，你要好好把握。」這是他第一次得到父親的{approval|認可}。"]},
{t:"綠能城市",p:[
"顧董把顧氏集團交給專業經理人後，提出一個讓所有人意外的要求：他希望顧氏和遠航合作，把集團在桃園的一座舊鋼鐵廠，改造成智慧綠能城市。「我這輩子蓋了太多工廠，」他說，「現在想留下一個讓人住得舒服的地方。」",
"這是一個巨大的工程。桃園的{population|人口}快速成長，{urban|都市}擴張卻沒有規劃，造成嚴重的{traffic|交通}問題。每天上下班時間，通往台北的道路{congestion|壅塞}不堪，很多人光是{commute|通勤}，一天就要花上三個小時。",
"新城市的設計原則很簡單：讓人走路就能生活。{housing|住宅}、學校、醫院和辦公室都規劃在步行十五分鐘的範圍內，大部分道路都以{pedestrian|行人}優先，汽車只能在外圍行駛。城市中心，是一座由舊鋼鐵廠改建的大公園。",
"能源全部來自{renewable|再生}能源。每一棟建築的{roof|屋頂}都鋪滿{solar|太陽能}板，海邊則設置了離岸風力{turbine|發電機}。遠航的AI系統會即時調整整座城市的用電，把多餘的電力儲存起來，在晚上或{cloudy|陰天}時使用。",
"城市裡所有的垃圾都會分類{recycle|回收}，{waste|廚餘}則送到發電廠轉成生質能源。舊鋼鐵廠留下的鋼材，也被重新用來蓋{bridge|橋樑}和公共藝術。顧董說，這叫做「讓舊東西有新生命」，就像他和兒子的關係一樣。",
"為了減少{carbon|碳}排放，城市裡的公車全部改成電動車，還有一套由AI調度的共享汽車系統。根據計算，整座城市的{emission|排放}量只有一般城市的四分之一。江念則在城市裡規劃了一套社區醫療網，讓每一位居民都能在五分鐘內找到醫生。",
"規劃階段最大的爭議，是人口{density|密度}。有人擔心，把這麼多人集中在一個小區域，會變得擁擠又吵鬧。顧承遠和設計團隊花了半年，把建築設計成高低錯落的形狀，留下大量綠地和天空，讓人在高密度的城市裡，也能感受到開闊。",
"五年後，第一批居民搬了進來。一位每天要通勤到台北的上班族說，現在他搭新的軌道{transport|運輸}系統，四十分鐘就能到公司，下班後還有時間陪孩子在公園裡踢球。一位老奶奶說，她最喜歡的，是晚上可以安心地在路上散步，因為到處都是燈光和笑聲。",
"啟用典禮上，顧董坐著{wheelchair|輪椅}，看著那座由舊鋼鐵廠改建的公園，眼眶紅了。他轉頭對兒子說：「這是我這輩子蓋過最好的東西。」顧承遠蹲下來，握住父親的手：「爸，是我們一起蓋的。」江念站在旁邊，悄悄拍下這一幕。那是她見過，他們父子倆笑得最像的一次。"]},
{t:"國際醫學獎",p:[
"那年秋天，江念收到一封來自瑞士的{email|電子郵件}。她看了三遍才敢相信：她和團隊的穿戴式心臟預警研究，被{nominate|提名}為國際醫學創新獎，這是全世界最{prestigious|有聲望}的醫學獎項之一。",
"消息傳回台灣，醫院上下都沸騰了。院長在全院大會上宣布，江念是台灣第一位{shortlist|入圍}這個獎項的女性醫師。記者們排隊要採訪她，連她的國中老師都打電話來，說要把她的照片貼在學校的{honor|榮譽}榜上。",
"這項研究被稱為心臟醫學的重大{breakthrough|突破}。過去，心臟病發作往往毫無預警，現在，只要一支智慧手錶，就能提前一週發出{warning|警訊}。全世界已經有超過一千萬人使用這套系統，估計救回了上萬條生命。",
"頒獎典禮在日內瓦舉行。江念穿著一件簡單的黑色禮服，和來自世界各地的科學家們坐在一起。她身邊坐著顧承遠，他特地推掉了一場重要的董事會。「你不是說，董事會比你的命還重要嗎？」江念小聲問。他回答：「那是以前。現在，妳比較重要。」",
"{host|主持人}宣布得獎者時，江念緊張得握緊顧承遠的手。「今年的國際醫學創新獎，頒給……來自台灣的江念醫師團隊！」全場起立鼓掌。江念愣在座位上，直到顧承遠輕輕推了她一下，她才站起來，走向舞台。",
"{jury|評審團}主席是一位八十歲的諾貝爾獎得主。他在頒獎時說：「這項{discovery|發現}最了不起的地方不只是科學，而是它讓醫療變得更平等。江醫師是醫療科技的{pioneer|先驅}，她證明了科技可以服務{humanity|全人類}，而不只是少數人。」",
"江念接過{trophy|獎盃}，站在麥克風前，深吸一口氣。「我想把這個{award|獎}獻給三種人，」她說，「第一，是急診室裡每一位不眠不休的醫護人員；第二，是台東山上的阿嬤們，她們教我什麼是勇敢；第三，」她看向台下，「是一個曾經拒絕簽手術同意書的病人。」",
"全場哄堂大笑。顧承遠在台下笑著搖頭，眼眶卻紅了。江念的得獎{speech|感言}在網路上瘋傳，各國媒體紛紛報導，稱讚她{outstanding|傑出}的研究和真誠的態度。她的故事獲得國際一致的{acclaim|讚譽}，也讓更多人開始關注偏鄉醫療。",
"回到飯店，江念把獎盃放在桌上，看著它發呆。「我從來沒想過會得獎，」她說，「我只是想讓阿嬤那樣的人，不用等到天亮才被送下山。」顧承遠從背後抱住她：「這份{recognition|肯定}是妳應得的。妳的{dedication|奉獻}，對這個世界的影響很{profound|深遠}。」她轉身看他，笑著說：「你今天說的好聽話，比你過去一年加起來還多。」"]},
{t:"最後一章",p:[
"十年後的夏天，雲棲酒店舉辦六十週年慶。程以安和許知夏決定，在這個特別的{occasion|場合}，邀請所有重要的老朋友回來{reunion|團聚}。邀請函寄出去的那天，許知夏站在大廳的銅鐘下，想起了很多很多事。",
"第一個到的，是陸景川和林語晴。他們的雙胞胎已經上大學了，一個讀資訊{engineering|工程}，一個讀教育。林語晴的App已經走進了二十個國家，陸景川則把陸氏集團交給專業團隊，自己每天在家練習泡咖啡。「這麼多年了，」林語晴笑著說，「他偶爾還是會灑出來。」",
"接著到的，是顧承遠和江念。他們在台東的部落辦了一場小小的婚禮，現在有一個七歲的{daughter|女兒}。小女孩一進大廳，就衝去敲那座銅鐘，敲得整間飯店都在響。江念趕緊追過去，顧承遠卻在旁邊笑：「沒關係，讓她敲。這是她第一次來這裡。」",
"三對夫妻{gather|聚集}在頂樓的景觀餐廳。窗外是台北的{skyline|夜景}，桌上擺著老吳的徒弟做的法式料理，{glass|玻璃}櫃裡還保存著那瓶一九六五年波爾多紅酒的{bottle|空瓶}。大家舉起杯子，一起{toast|乾杯}。",
"他們聊起了過去：颱風夜的薑湯、急診室的同意書、灑在西裝上的那杯咖啡。每一個故事都讓大家笑得前仰後合，也讓人有點{sentimental|感傷}。陸景川說：「回頭看才發現，我們每個人的故事，都是從一場意外開始的。」",
"程以安點頭：「也是從一個人開始的。」他看著許知夏，「我以前總覺得，成功就是把公司做大。後來才知道，真正的{accomplishment|成就}，是有一個人願意陪你走完這段路。」許知夏笑著說：「你這麼多年，終於說了一句像樣的話。」",
"林語晴說，她最近在寫一本書，記錄這些年從偏鄉孩子身上學到的事。「孩子們教我，要對未來保持{optimistic|樂觀}，」她說，「世界會一直{evolve|改變}，但{kindness|善良}和{courage|勇氣}永遠不會過時。」江念補充：「還有，換個{perspective|角度}看事情，困難就沒有那麼可怕。」",

const synth='speechSynthesis' in window?window.speechSynthesis:null;
let voices=[];
function loadV(rerender){voices=synth?synth.getVoices():[];if(rerender&&curView()==='stats'&&!document.querySelector('.sheet.open'))render(true)}
if(synth){loadV(false);synth.onvoiceschanged=()=>loadV(true)}
const vl=v=>v.lang.replace('_','-').toLowerCase();
function vScore(v,want){const n=v.name,l=vl(v);let s=0;
  if(/natural|neural/i.test(n))s+=60;if(/online/i.test(n))s+=25;if(/premium|enhanced|高品質|加強/i.test(n))s+=45;if(/google/i.test(n))s+=35;if(/siri/i.test(n))s+=25;if(/compact|espeak|robot|novelty/i.test(n))s-=50;
  if(want==='en')s+=l==='en-us'?12:l==='en-gb'?8:0;else s+=l==='zh-tw'?20:/hant|cmn/.test(l)?14:0;return s}
function voiceList(want){return voices.filter(v=>{const l=vl(v);return want==='en'?l.startsWith('en'):(l.startsWith('zh')||l.startsWith('cmn'))&&!/yue|hk/.test(l)}).sort((a,b)=>vScore(b,want)-vScore(a,want))}
function pickVoice(want){const pref=want==='en'?S.voiceEn:S.voiceZh,list=voiceList(want);return(pref&&list.find(v=>v.voiceURI===pref))||list[0]||null}
function utter(text,want,mult){const u=new SpeechSynthesisUtterance(text);const v=pickVoice(want);if(v){u.voice=v;u.lang=v.lang}else u.lang=want==='en'?'en-US':'zh-TW';u.rate=S.rate*(mult||1);u.pitch=1;return u}
let curU=null;
function speak(text,want='en',mult=1){if(!synth){toast('這個瀏覽器不支援語音朗讀');return}stopRead();synth.cancel();curU=utter(text,want,mult);synth.speak(curU)}
function sentences(p){const out=[];let b='';for(let i=0;i<p.length;i++){const c=p[i];b+=c;if(('。！？'.includes(c)&&p[i+1]!=='」')||(c==='」'&&'。！？'.includes(p[i-1]))){out.push(b);b=''}}if(b.trim())out.push(b);return out}
const R={on:false,seg:[],i:0,lastP:-1};
function readChapter(c){
  if(!synth){toast('這個瀏覽器不支援語音朗讀');return}
  if(R.on){stopRead();return}
  synth.cancel();R.seg=[];const ok=t=>/[\u4e00-\u9fff\w]/.test(t);
  c.p.forEach((p,pi)=>sentences(p).forEach(sn=>{
    if(S.mode==='smooth'){const t=sn.replace(RE,'$1');if(ok(t))R.seg.push({t,w:'zh',p:pi});return}
    let last=0;for(const m of sn.matchAll(RE)){const b=sn.slice(last,m.index);if(ok(b))R.seg.push({t:b,w:'zh',p:pi});R.seg.push({t:m[1],w:'en',p:pi});last=m.index+m[0].length}
    const r=sn.slice(last);if(ok(r))R.seg.push({t:r,w:'zh',p:pi});
  }));
  R.on=true;R.i=0;R.lastP=-1;readBtn();nextSeg();
}
function nextSeg(){if(!R.on)return;if(R.i>=R.seg.length){stopRead();return}const s=R.seg[R.i++];if(s.p!==R.lastP){markPara(s.p);R.lastP=s.p}curU=utter(s.t,s.w);curU.onend=nextSeg;curU.onerror=nextSeg;synth.speak(curU)}
function stopRead(){const was=R.on;R.on=false;if(was&&synth)synth.cancel();markPara(-1);readBtn()}
function markPara(i){document.querySelectorAll('.story p').forEach((el,j)=>{el.classList.toggle('reading',j===i);if(j===i)el.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})})}
